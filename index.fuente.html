<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f5f9">

<script>(function(){var t;try{t=localStorage.getItem("hub-tema")}catch(e){}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light")})()</script>
<title>Plant Operational Hub · L10</title>
<style>
/* ===================================================================
   Operational Hub L10 · Hoja de estilos
   Tema claro (por defecto) y tema oscuro: html[data-theme=dark]
   =================================================================== */
:root{
 color-scheme:light;
 --bg:#f3f5f9;--p:#ffffff;--p2:#f7f9fc;--p3:#edf1f7;
 --l:#e2e8f0;--l2:#edf1f6;
 --tx:#0f172a;--tx2:#334155;--mu:#64748b;
 --pri:#1d4ed8;--btn:#1d4ed8;--btn-h:#1e40af;--pri-s:#eaf0ff;
 --good:#047857;--warn:#b45309;--bad:#dc2626;
 --good-s:#ecfdf5;--warn-s:#fffbeb;--bad-s:#fef2f2;
 --hd:#ffffffe6;--hv:#0f172a08;--grid:#e8edf4;--ov:#0f172a73;
 --sh1:0 1px 2px #0f172a0a,0 1px 3px #0f172a0d;
 --sh2:0 4px 14px #0f172a14;
 --sh3:0 24px 60px #0f172a33;
 --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme=dark]{
 color-scheme:dark;
 --bg:#070b14;--p:#0e1526;--p2:#121b30;--p3:#18233d;
 --l:#1f2a45;--l2:#172039;
 --tx:#e8edf7;--tx2:#c4cde2;--mu:#8391ae;
 --pri:#6b97ff;--btn:#3366e6;--btn-h:#4a7bf2;--pri-s:#14234d;
 --good:#34d399;--warn:#fbbf24;--bad:#f87171;
 --good-s:#0b2a22;--warn-s:#2b2310;--bad-s:#2c1519;
 --hd:#0a1120e6;--hv:#ffffff0a;--grid:#1a2540;--ov:#02050dbf;
 --sh1:0 1px 2px #00000066;
 --sh2:0 6px 20px #00000066;
 --sh3:0 30px 80px #000000b3;
}

*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--tx);display:grid;grid-template-columns:248px 1fr;min-height:100vh;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:color-mix(in srgb,var(--pri) 25%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--l);border-radius:9px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:var(--mu)}
b,strong,h2,h3,h4{font-weight:600}

/* ---------- Barra lateral ---------- */
#side{background:var(--p);border-right:1px solid var(--l);padding:20px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}
.lg{width:38px;height:38px;border-radius:10px;background:var(--btn);color:#fff;display:grid;place-items:center;flex:none}
.lg svg{width:20px;height:20px}
.brand b{display:block;font-size:12.5px;letter-spacing:.09em;font-weight:700}.brand small{color:var(--mu);font-size:11px}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);font-weight:600;padding:0 12px;margin-bottom:-16px}
.nav{display:grid;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;border:0;background:none;border-radius:8px;color:var(--tx2);font-weight:500;font-size:13.5px;transition:background .15s,color .15s;text-align:left}
.nav button:hover{background:var(--hv);color:var(--tx)}
.nav button.on{background:var(--pri-s);color:var(--pri);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--pri)}
.nav svg{width:17px;height:17px;flex:none}
.nav em{margin-left:auto;font-style:normal;font-size:11px;font-weight:600;background:var(--warn-s);color:var(--warn);padding:1px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.mods{border-top:1px solid var(--l);padding-top:16px}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:10px;padding:0 6px}
.mh button{background:none;border:0;color:var(--pri);display:grid;border-radius:6px;padding:3px}.mh button:hover{background:var(--hv)}.mh svg{width:15px;height:15px}
.sm1{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;margin-bottom:2px;font-size:12.5px;color:var(--tx2)}
.sm1 svg{width:14px;height:14px;color:var(--mu)}

/* ---------- Encabezado ---------- */
#shell{min-width:0}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:11px 32px;background:var(--hd);backdrop-filter:blur(12px);border-bottom:1px solid var(--l)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px}.crumb svg{width:14px;height:14px}.crumb b{color:var(--tx);font-weight:600}
.hr{display:flex;align-items:center;gap:10px}
select,input:not([type=radio]),textarea{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent)}
.ib{position:relative;width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--l);background:var(--p);color:var(--tx2);transition:background .15s,color .15s,border-color .15s;flex:none}
.ib:hover{background:var(--p3);color:var(--tx)}.ib svg{width:16px;height:16px}
.ib.ok:hover{background:var(--good-s);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.ib.no:hover{background:var(--bad-s);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
html:not([data-theme=dark]) .i-sun,html[data-theme=dark] .i-moon{display:none}
.nb{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:0 5px;border-radius:99px;display:none;min-width:16px;text-align:center;line-height:16px;border:2px solid var(--p);box-sizing:content-box}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--p2);border:1px solid var(--l);font-size:12px;color:var(--tx2)}.pill svg{width:15px;height:15px;color:var(--mu)}.pill b{color:var(--pri)}
.rel{position:relative}
.drop{position:absolute;right:0;top:44px;width:330px;background:var(--p);border:1px solid var(--l);border-radius:12px;padding:12px;box-shadow:var(--sh3);opacity:0;pointer-events:none;transform:translateY(-6px);transition:.18s var(--ease);z-index:30}
.drop.on{opacity:1;pointer-events:auto;transform:none}
.dh2{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px}.dh2 button{background:none;border:0;color:var(--pri);font-weight:600}
#nList,#repNL{max-height:300px;overflow:auto;display:grid;gap:6px}
.nt{padding:9px 11px;border-radius:8px;background:var(--p2);border:1px solid var(--l);font-size:12px}.nt.un{border-left:3px solid var(--pri)}.nt small{display:block;color:var(--mu);font-size:10.5px}
.me{display:flex;align-items:center;gap:10px;order:9;margin-left:6px;padding-left:14px;border-left:1px solid var(--l)}
.me .av,.rp-user .av{width:34px;height:34px;border-radius:50%;background:var(--pri-s);color:var(--pri);border:1px solid color-mix(in srgb,var(--pri) 25%,transparent);display:grid;place-items:center;font-weight:700;font-size:13px}
.me b{display:block;font-size:12.5px;line-height:1.2}.me small{display:block;color:var(--mu);font-size:11px;line-height:1.2}

/* ---------- Contenido ---------- */
main{padding:28px 32px 56px;max-width:1500px}
.view{display:none}
.view.on{display:block;animation:in .3s var(--ease)}
.view.out{display:block;opacity:0;transition:.12s ease-in}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h2{font-size:22px;letter-spacing:-.015em;font-weight:650}.ph p{color:var(--mu);font-size:13px;margin-top:2px}.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;border:1px solid var(--l);background:var(--p);box-shadow:var(--sh1);font-weight:600;font-size:13px;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{background:var(--p3)}.btn svg{width:15px;height:15px}
.btn:focus-visible,.ib:focus-visible,.nav button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.b-pri,.b-amb,.b-ok,.b-no{color:#fff;border-color:transparent}
.b-pri{background:var(--btn)}.b-pri:hover{background:var(--btn-h)}
.b-amb{background:#c2410c}.b-amb:hover{background:#9a3412}
.b-ok{background:#047857}.b-ok:hover{background:#065f46}
.b-no{background:#b91c1c}.b-no:hover{background:#991b1b}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px}
.kpi{--c:var(--pri);display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:12px;background:var(--p);border:1px solid var(--l);box-shadow:var(--sh1);min-width:0}
.kt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kt small{color:var(--mu);font-size:12px;font-weight:500}
.kt svg{width:30px;height:30px;padding:7px;border-radius:8px;background:color-mix(in srgb,var(--c) 11%,var(--p));color:var(--c);flex:none}
.kpi b{font-size:28px;line-height:1.1;letter-spacing:-.02em;font-weight:650;font-variant-numeric:tabular-nums}
.ks{font-size:11.5px;color:var(--mu);line-height:1.35}
.dl{font-weight:600}.dl.up{color:var(--good)}.dl.dn{color:var(--bad)}.dl.nu{color:var(--mu)}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:16px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:1/-1}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:20px;min-width:0;box-shadow:var(--sh1)}
.card.flush{padding:0;overflow:hidden}
.card h4{font-size:13.5px;font-weight:600;color:var(--tx);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h4 svg{width:16px;height:16px;color:var(--mu)}
.chd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.chd h4{margin:0}.chd p{font-size:12px;color:var(--mu);margin-top:3px}
.ch{height:250px;position:relative}.ch.tall{height:290px}
.seg{display:inline-flex;padding:3px;background:var(--p3);border-radius:9px;border:1px solid var(--l)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--mu);transition:.15s}
.seg button:hover{color:var(--tx)}.seg button.on{background:var(--p);color:var(--tx);box-shadow:var(--sh1)}
.view.on .kpi,.view.on .card,.view.on .scale{animation:up .35s var(--ease) both}
.view.on .kpis>:nth-child(2){animation-delay:.04s}.view.on .kpis>:nth-child(3){animation-delay:.08s}.view.on .kpis>:nth-child(4){animation-delay:.12s}.view.on .kpis>:nth-child(5){animation-delay:.16s}.view.on .kpis>:nth-child(6){animation-delay:.2s}
.view.on.still .kpi,.view.on.still .card{animation:none}
.urow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:var(--p2);border:1px solid var(--l);margin-bottom:8px;cursor:pointer;border-left:3px solid var(--c);transition:background .15s}
.urow:hover{background:var(--p3)}.urow:last-child{margin-bottom:0}.urow div{flex:1;min-width:0}.urow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600}
.mrow{margin-bottom:16px}.mrow:last-child{margin-bottom:0}.mrow .bar{margin:7px 0 0}
.mrow>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px}.mrow b{font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:600;background:var(--p2);border-bottom:1px solid var(--l);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--l2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.row{animation:up .3s var(--ease) both}tr.row:hover td{background:var(--hv)}
.ra{text-align:right;white-space:nowrap}.ra .ib{margin-left:4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}.acc{color:var(--pri);font-weight:600}.mu{color:var(--mu)}.sm{font-size:11.5px}.warn-t{color:var(--warn);font-weight:500}.empty{text-align:center;color:var(--mu);padding:32px;font-size:13px}
.badge{--c:#64748b;display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--c) 11%,var(--p));color:color-mix(in srgb,var(--c) 72%,var(--tx));border:1px solid color-mix(in srgb,var(--c) 26%,transparent);white-space:nowrap}
.badge svg{width:12px;height:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block}
.sla{display:inline-block;margin-top:3px;font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.01em}.sla.ok{color:var(--good)}.sla.warn{color:var(--warn)}.sla.over{color:var(--bad);animation:blink 1.4s infinite}
.scale{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.scale span{--c:#888;display:flex;align-items:center;gap:7px;padding:4px 12px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--p);border:1px solid var(--l);color:var(--tx2)}
.tb{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--l);flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--l);background:var(--p);color:var(--tx2);padding:5px 12px;border-radius:99px;font-size:12px;font-weight:500;transition:.15s}
.chips button:hover{background:var(--p3)}
.chips button.on{background:var(--btn);border-color:var(--btn);color:#fff}.chips em{font-style:normal;margin-left:6px;opacity:.75}
.search{max-width:280px}
.stack{display:grid;gap:16px}.ch2{display:flex;justify-content:space-between;align-items:center}.ch2 h4{margin:0}
.bar{height:6px;background:var(--p3);border-radius:9px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .8s var(--ease)}
.bar i.ok{background:var(--good)}
.crit{--c:#64748b;display:inline-block;padding:2px 9px;border-radius:6px;font-weight:600;font-size:11.5px;background:color-mix(in srgb,var(--c) 12%,var(--p));color:color-mix(in srgb,var(--c) 72%,var(--tx));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);white-space:nowrap}
.lock,.rej{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:10px;background:var(--bad-s);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad);font-size:13px}
.rej{display:block;padding:10px 12px;font-size:12px}

/* ---------- Ventanas y formularios ---------- */
#modal{position:fixed;inset:0;background:var(--ov);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:.18s}
#modal.on{opacity:1;pointer-events:auto}
.dlg{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--p);border:1px solid var(--l);border-radius:14px;box-shadow:var(--sh3);transform:translateY(10px) scale(.98);transition:.25s var(--ease)}
#modal.on .dlg{transform:none}
.dh,.df{display:flex;justify-content:space-between;align-items:center;padding:16px 22px}.dh{border-bottom:1px solid var(--l)}.df{border-top:1px solid var(--l);justify-content:flex-end;gap:8px;background:var(--p2);border-radius:0 0 14px 14px}
.dh h3{font-size:15px;display:flex;gap:10px;align-items:center}.dh h3 svg{width:18px;height:18px;color:var(--pri)}
.x{background:none;border:0;font-size:24px;color:var(--mu);line-height:1}.x:hover{color:var(--tx)}.db{padding:22px;display:grid;gap:14px}
.fl{display:grid;gap:6px;font-size:12.5px}.fl>span{color:var(--tx2);font-weight:600}
.urg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.urg label{cursor:pointer}.urg input{display:none}
.urg span{display:grid;text-align:center;padding:9px 2px;border:1px solid var(--l);border-top:3px solid var(--c);border-radius:8px;background:var(--p);transition:.15s}
.urg span:hover{background:var(--p2)}
.urg b{font-size:11.5px}.urg small{font-size:10px;color:var(--mu)}
.urg input:checked+span{background:color-mix(in srgb,var(--c) 12%,var(--p));border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.tl{display:grid;gap:10px;border-left:2px solid var(--l);padding-left:14px;font-size:12.5px}.tl small{color:var(--mu);display:block}

/* ---------- Chat ---------- */
.chat{display:grid;grid-template-columns:260px 1fr;gap:16px;height:560px}
.cl{display:grid;gap:4px;align-content:start}.cl button{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:8px;border:0;background:none;color:var(--tx2);font-weight:500;transition:.15s}
.cl button.on{background:var(--pri-s);color:var(--pri);font-weight:600}.cl button:not(.on):hover{background:var(--hv)}.cl svg{width:15px;height:15px}
.cb{display:flex;flex-direction:column;padding:0;overflow:hidden}.cm{flex:1;overflow:auto;padding:18px;display:grid;gap:10px;align-content:start}
.msg{display:flex;flex-direction:column;animation:up .25s var(--ease)}.msg.me{align-items:flex-end;margin:0}.msg small{font-size:10.5px;color:var(--mu);margin-bottom:3px}
.msg div{padding:9px 14px;border-radius:12px;max-width:75%;background:var(--p3);border:1px solid var(--l);border-bottom-left-radius:4px}.msg.me div{background:var(--btn);color:#fff;border:0;border-radius:12px;border-bottom-right-radius:4px}
.ci{display:flex;gap:8px;padding:12px;border-top:1px solid var(--l)}

/* ---------- Avisos ---------- */
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:60}
.toast{padding:12px 16px;border-radius:10px;background:var(--p);border:1px solid var(--l);border-left:4px solid var(--pri);box-shadow:var(--sh2);font-size:13px;animation:slide .3s var(--ease);max-width:380px}
.toast.ok{border-left-color:#10b981}.toast.err{border-left-color:#ef4444}.toast.bye{opacity:0;transform:translateX(30px);transition:.3s}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.5}}

/* ---------- Inicio de sesión ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(900px 480px at 50% -10%,color-mix(in srgb,var(--pri) 9%,transparent),transparent),var(--bg);z-index:80}
body.in #login{display:none}body:not(.in) #side,body:not(.in) #shell{display:none}
.lth{position:absolute;top:18px;right:18px}
.lcard{width:360px;max-width:calc(100vw - 32px);display:grid;gap:12px;padding:34px 32px;background:var(--p);border:1px solid var(--l);border-radius:16px;box-shadow:var(--sh2);animation:up .4s var(--ease)}
.lcard .lg{margin:0 auto 6px;width:46px;height:46px;border-radius:12px}.lcard .lg svg{width:24px;height:24px}
.lcard h2{text-align:center;font-size:19px;letter-spacing:-.01em}.lcard p{text-align:center;color:var(--mu);font-size:13px;margin-bottom:6px}
#lErr{color:var(--bad);font-size:12px;min-height:16px;text-align:center}
.lfoot{text-align:center;font-size:11px;color:var(--mu);margin-top:4px}

/* ---------- Portal del Reportero (navegación superior) ---------- */
body:not(.in) #rep{display:none}
body.rep #side,body.rep #shell{display:none}

.rp-brand{display:flex;gap:11px;align-items:center}

.rp-nm b{display:block;font-size:12.5px;line-height:1.2}.rp-nm small{color:var(--mu);font-size:11px}
.rp-main{max-width:1080px;margin:0 auto;padding:30px 24px 60px}
.rp-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.rp-hero h2{font-size:24px;letter-spacing:-.015em}.rp-hero p{color:var(--mu)}
.rp-new{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
.rp-form{display:grid;gap:14px;padding:26px}.rp-form h2{font-size:20px;letter-spacing:-.01em}
.rp-big{justify-content:center;padding:11px 16px;font-size:14px}
.rp-side{display:grid;gap:16px}
.rp-how{padding-left:18px;display:grid;gap:8px;font-size:12.5px;color:var(--mu)}.rp-how b{color:var(--tx)}
.rp-mini{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--l);cursor:pointer}.rp-mini:last-child{border:0}.rp-mini>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.rp-stat{--c:var(--pri);display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--l);background:var(--p);box-shadow:var(--sh1);transition:.15s}
.rp-stat:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--l))}
.rp-stat.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--p));box-shadow:0 0 0 1px var(--c)}
.rp-stat>svg{width:36px;height:36px;padding:9px;border-radius:9px;background:color-mix(in srgb,var(--c) 12%,var(--p));color:var(--c)}
.rp-stat small{display:block;color:var(--mu);font-size:11.5px}.rp-stat b{font-size:24px;line-height:1.1;font-weight:650}
.rp-tb{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rp-list{display:grid;gap:12px}
.rp-tk{--c:var(--pri);display:grid;gap:8px;padding:16px 18px;background:var(--p);border:1px solid var(--l);border-left:4px solid var(--c);border-radius:12px;box-shadow:var(--sh1)}
.rp-th{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rp-tk h3{font-size:15.5px;letter-spacing:-.005em}
.rp-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu)}.rp-meta b{color:var(--tx)}.rp-meta .sla{margin:0}
.rp-st{display:grid;grid-template-columns:repeat(4,1fr);margin-top:6px}
.rp-st div{position:relative;text-align:center;font-size:11.5px;font-weight:600;color:var(--mu)}
.rp-st div::before{content:'';position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--l)}
.rp-st div:first-child::before{display:none}
.rp-st i{position:relative;z-index:1;display:grid;place-items:center;width:24px;height:24px;margin:0 auto 4px;border-radius:50%;background:var(--p3);border:1px solid var(--l);font-style:normal;font-weight:700;font-size:11px}
.rp-st .dn i{background:var(--btn);border-color:var(--btn);color:#fff}.rp-st .dn::before,.rp-st .now::before{background:var(--btn)}
.rp-st .now{color:var(--tx)}.rp-st .now i{background:var(--p);border:2px solid var(--btn);color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--btn) 18%,transparent)}
.rp-end{padding:8px 12px;border-radius:8px;font-size:12px;background:color-mix(in srgb,var(--c) 9%,var(--p));border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.rp-act{display:flex;gap:8px;justify-content:flex-end}

<script>
/* ===== Roles, escala de urgencia (SLA) y capa de datos (caché sincronizada con Firestore) ===== */
const USERS={},S={user:null};               /* USERS se llena desde Firestore (colección usuarios) */
const RL={admin:'Administrador',comun:'Usuario común',reportero:'Reportero'};
const rolDe=e=>USERS[e]?USERS[e].r:null,esAdmin=()=>rolDe(S.user)==='admin',puedeGestionar=()=>['admin','comun'].includes(rolDe(S.user)),esRep=()=>rolDe(S.user)==='reportero';
const usersRol=rs=>Object.values(USERS).filter(u=>rs.includes(u.r)).map(u=>[u.email,u.n]);
const notifyRoles=(rs,m)=>usersRol(rs).filter(([e])=>e!==S.user).forEach(([e])=>notify(e,m));
const nom=e=>USERS[e]?USERS[e].n:(e||'—');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
/* min = minutos máximos de atención; 0 = durante esta semana (hasta el domingo 23:59) */
const URG={
 1:{n:'Crítica',min:30,c:'#ef4444',t:'30 min'},
 2:{n:'Alta',min:60,c:'#f97316',t:'1 hora'},
 3:{n:'Media',min:240,c:'#eab308',t:'4 horas'},
 4:{n:'Baja',min:1440,c:'#84cc16',t:'24 horas'},
 5:{n:'Programada',min:0,c:'#10b981',t:'Esta semana'}};
const PCRIT={1:'#10b981',2:'#84cc16',3:'#eab308',4:'#f97316',5:'#ef4444'};
const MOTIVOS=['Duplicado','Información insuficiente','No es competencia de este equipo','Sin evidencia / no reproducible','Ya estaba resuelto','No procede','Otro'];

/* Caché en memoria: firebase.js la actualiza con onSnapshot; DB.set escribe solo los documentos que cambiaron */
const C={puntos:[],tickets:[],modulos:[],notificaciones:[],chat:[]};
const COL={puntos:{id:x=>x.id},tickets:{id:x=>x.id},notificaciones:{id:x=>String(x.id)},chat:{id:x=>String(x.id)},
 modulos:{id:x=>x.replace(/\W/g,'_')+x.length,doc:x=>({nombre:x,orden:Date.now()})}};
/* get devuelve una COPIA: así DB.set puede comparar contra la caché real y detectar qué documentos cambiaron (antes mutaba la caché y no se escribía nada) */
const DB={get:(k,d)=>C[k]===undefined?d:JSON.parse(JSON.stringify(C[k])),
 set(k,v){const cfg=COL[k],old=new Map((C[k]||[]).map(x=>[cfg.id(x),JSON.stringify(x)])),seen=new Set();C[k]=v;
  v.forEach(x=>{const id=cfg.id(x),o=old.get(id);seen.add(id);if(o===JSON.stringify(x))return;
   if(k==='tickets'){const b=o?(JSON.parse(o).v||0):0;x.v=b+1;FB.putVer(k,id,x,o?b:null)}  /* escritura condicionada a la versión que viste */
   else FB.put(k,id,cfg.doc?cfg.doc(x):x)});
  old.forEach((_,id)=>{if(!seen.has(id))FB.del(k,id)})}};
function resetCache(){for(const k in C)C[k]=[];Object.keys(USERS).forEach(k=>delete USERS[k])}

function calcSla(base,u){
 const m=URG[u].min;if(m)return base+m*60000;
 const d=new Date(base);d.setDate(d.getDate()+(7-d.getDay())%7);d.setHours(23,59,59,0);return d.getTime();
}
function addHist(t,txt){t.hist=t.hist||[];t.hist.push({t:Date.now(),u:S.user,txt})}
function notify(to,msg){
 const n=DB.get('notificaciones',[]);
 n.unshift({id:Date.now()+String(Math.floor(Math.random()*1e4)).padStart(4,'0'),destinatario:to,mensaje:msg,leido:false,fecha:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})});
 DB.set('notificaciones',n.slice(0,300));
}
</script>
<script>
/* ===== Utilidades de interfaz: modales, toasts, sonido, navegación, helpers compartidos ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const icons=()=>{if(window.lucide)lucide.createIcons()};
function toast(m,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>{e.classList.add('bye');setTimeout(()=>e.remove(),300)},3400)}
let _ac;
function beep(n=4){try{const A=window.AudioContext||window.webkitAudioContext;_ac=_ac||new A();const c=_ac;if(c.state==='suspended')c.resume();
 const m=c.createGain(),k=c.createDynamicsCompressor();m.gain.value=1;m.connect(k);k.connect(c.destination);
 for(let i=0;i<n;i++){const t=c.currentTime+i*.5,o=c.createOscillator(),g=c.createGain(),up=i%2;o.type='square';o.frequency.setValueAtTime(up?988:740,t);o.frequency.exponentialRampToValueAtTime(up?1480:1175,t+.4);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1,t+.03);g.gain.exponentialRampToValueAtTime(.01,t+.45);o.connect(g);g.connect(m);o.start(t);o.stop(t+.5)}}catch(e){}}
function hablar(txt){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt),v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('es'));u.lang='es-MX';u.volume=1;u.rate=.95;if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
/* Avisos por voz. Solo suenan a quien le corresponde (lo decide firebase.js al detectar el cambio en tiempo real) */
const numTk=id=>String(id).replace(/\D/g,'');
function alertaTicket(t){const s=URG[t.urgencia]?URG[t.urgencia].n:'',fuerte=t.urgencia<=2;
 beep(fuerte?4:2);toast(`🚨 Nuevo ticket · urgencia ${s} · ${nom(t.usuarioReporta)} · ${t.modulo}`,'err');
 setTimeout(()=>hablar(`Nuevo ticket de urgencia ${s}. Módulo: ${t.modulo}. Levantado por ${nom(t.usuarioReporta)}.`),fuerte?2100:1100)}
function avisoTomado(t){beep(2);toast(`✅ ${nom(t.usuarioAsignado)} tomó tu ticket ${t.id}`,'ok');
 setTimeout(()=>hablar(`Tu ticket número ${numTk(t.id)} fue tomado por ${nom(t.usuarioAsignado)}.`),1100)}
function avisoCierre(t){const rech=t.estado==='rechazado',q=nom(rech?t.rechazadoPor:t.cierra);
 beep(2);toast(`${rech?'⛔':'✅'} Tu ticket ${t.id} fue ${rech?'rechazado':'cerrado'} por ${q}`,rech?'err':'ok');
 setTimeout(()=>hablar(`Tu ticket número ${numTk(t.id)} fue ${rech?'rechazado':'cerrado'} por ${q}.`),1100)}
/* Los navegadores bloquean audio y voz hasta el primer clic de la persona */
document.addEventListener('click',()=>{try{const A=window.AudioContext||window.webkitAudioContext;_ac=_ac||new A();_ac.resume();speechSynthesis.getVoices()}catch(e){}},{once:true});
function countTo(el,n){const s=+el.dataset.v||0,t0=performance.now();el.dataset.v=n;(function f(t){const p=Math.min(1,(t-t0)/650);el.textContent=Math.round(s+(n-s)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}

/* Modal genérico */
function openModal({title,icon='circle',body,ok='Guardar',cls='b-pri',onOk}){
 $('#dlg').innerHTML=`<div class="dh"><h3><i data-lucide="${icon}"></i>${title}</h3><button class="x" onclick="closeModal()">×</button></div><div class="db">${body}</div><div class="df"><button class="btn" onclick="closeModal()">${onOk?'Cancelar':'Cerrar'}</button>${onOk?`<button class="btn ${cls}" id="mok">${ok}</button>`:''}</div>`;
 if(onOk)$('#mok').onclick=()=>{if(onOk()!==false)closeModal()};
 $('#modal').classList.add('on');icons();
 const f=$('#dlg input:not([type=radio]),#dlg textarea,#dlg select');if(f)setTimeout(()=>f.focus(),80);
}
const closeModal=()=>$('#modal').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const fld=(l,h)=>`<label class="fl"><span>${l}</span>${h}</label>`;
const opts=(a,sel)=>a.map(([v,t])=>`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(t)}</option>`).join('');
const urgPick=sel=>`<div class="fl"><span>¿Qué tan crítica es la atención?</span><div class="urg">${Object.entries(URG).map(([k,u])=>`<label style="--c:${u.c}"><input type="radio" name="urg" value="${k}" ${k==sel?'checked':''}><span><b>${u.n}</b><small>${u.t}</small></span></label>`).join('')}</div><small class="mu">Tiempo máximo de atención: desde los próximos 30 minutos hasta esta semana.</small></div>`;
const urgVal=()=>+$('input[name=urg]:checked').value;

/* Helpers compartidos */
const ST={abierto:['Abierto','#ef4444'],asignado:['Asignado','#f59e0b'],resuelto:['Resuelto','#10b981'],rechazado:['Rechazado','#8393b2'],revocado:['Revocado','#64748b'],pendiente:['Pendiente','#ef4444'],en_proceso:['En proceso','#f59e0b'],atendido:['Atendido','#10b981']};
const badge=s=>`<span class="badge" style="--c:${ST[s][1]}">${ST[s][0]}</span>`;
const urgB=u=>`<span class="badge" style="--c:${URG[u].c}"><i class="dot"></i>${URG[u].n}</span>`;
const activo=t=>t.estado==='abierto'||t.estado==='asignado';
const fmtD=d=>new Date(d).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function fmtCount(ms){const a=Math.abs(ms),s=Math.floor(a/1000),d=Math.floor(s/86400),p=n=>String(n).padStart(2,'0');return(ms<0?'Vencido +':'')+(d?d+'d ':'')+p(Math.floor(s%86400/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)}
function fmtLeft(ms){const m=Math.floor(Math.abs(ms)/60000),h=Math.floor(m/60),d=Math.floor(h/24),s=d?`${d}d ${h%24}h`:h?`${h}h ${m%60}m`:`${m}m`;return ms<0?'Vencido hace '+s:'Quedan '+s}
const slaCls=(t,l)=>l<0?'over':l<(t.sla-(t.slaIni||t.creado))*.25?'warn':'ok';
const slaHtml=t=>{if(!activo(t))return'';const l=t.sla-Date.now();return`<span class="sla ${slaCls(t,l)}" data-sla="${t.id}">⏱ ${fmtCount(l)}</span>`};
function stats(){const p=DB.get('puntos',[]),t=DB.get('tickets',[]),now=Date.now();return{p,t,total:p.length+t.length,
 pend:p.filter(x=>x.estado==='pendiente').length+t.filter(x=>x.estado==='abierto').length,
 proc:p.filter(x=>x.estado==='en_proceso').length+t.filter(x=>x.estado==='asignado').length,
 ok:p.filter(x=>x.estado==='atendido').length+t.filter(x=>x.estado==='resuelto').length,
 rej:t.filter(x=>x.estado==='rechazado').length,over:t.filter(x=>activo(x)&&x.sla<now).length}}

/* Navegación con transición salida/entrada */
const TITLES={dashboard:'Dashboard',tickets:'Tickets y hallazgos',modulos:'Módulos L10',tareas:'Mis tareas',admin:'Asignación',usuarios:'Usuarios',chat:'Chat'};
let cur='dashboard';
function go(v){
 const old=$('.view.on');if(old&&v===cur)return;
 const show=()=>{$$('.view').forEach(x=>x.classList.remove('on','out'));$('#v-'+v).classList.add('on');cur=v;if(v==='dashboard')dashAnim=true;
  $$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#crumb').textContent=TITLES[v];renderAll();scrollTo({top:0})};
 if(old){old.classList.add('out');setTimeout(show,180)}else show();
}

/* ===== Tema claro / oscuro (se recuerda en este navegador) ===== */
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const temaActual=()=>document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
function setTema(t,guardar=true){
 document.documentElement.setAttribute('data-theme',t);
 const m=$('meta[name=theme-color]');if(m)m.content=t==='dark'?'#070b14':'#f3f5f9';
 if(guardar)try{localStorage.setItem('hub-tema',t)}catch(e){}
 $$('.thbtn').forEach(b=>{const x=t==='dark'?'Cambiar a modo claro':'Cambiar a modo oscuro';b.title=x;b.setAttribute('aria-label',x)});
 /* Las gráficas toman sus colores del tema: se vuelven a dibujar sin animación */
 if(guardar&&S.user&&!esRep()&&cur==='dashboard'){dashAnim=false;renderDashboard();icons()}
}
const toggleTema=()=>setTema(temaActual()==='dark'?'light':'dark');
setTema(temaActual(),false);
</script>
<script>
/* ===== Dashboard: indicadores, tendencia y análisis de trabajo ===== */
let charts=[],dashDias=14,dashAnim=true;
const DIAS=[[7,'7 días'],[14,'14 días'],[30,'30 días'],[90,'90 días']];
const DAY=864e5;

/* Duración legible: 45 min · 3 h 20 min · 2 d 4 h */
function fmtDur(ms){if(!(ms>0))return'—';const m=Math.round(ms/6e4),h=Math.floor(m/60),d=Math.floor(h/24);return d?`${d} d ${h%24} h`:h?`${h} h ${m%60} min`:`${m} min`}
const inicioDia=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
/* Fecha 'AAAA-MM-DD' (puntos 5S) a milisegundos locales */
const msDe=s=>s?new Date(s+'T12:00:00').getTime():0;

/* Todo el análisis se calcula aquí a partir de tickets y puntos 5S */
function analisis(s,dias){
 const hoyI=inicioDia(Date.now()),desde=hoyI-(dias-1)*DAY,desdeAnt=desde-dias*DAY;
 const T=s.t,P=s.p,now=Date.now();
 /* eventos: [momento, tipo]; creado = se levantó, cerrado = se resolvió / atendió */
 const ev=[];
 T.forEach(t=>{ev.push([t.creado,'c']);if(t.estado==='resuelto'&&t.cerrado)ev.push([t.cerrado,'k'])});
 P.forEach(p=>{ev.push([msDe(p.fechaLevantamiento),'c']);if(p.estado==='atendido'&&p.fechaCumplido)ev.push([msDe(p.fechaCumplido),'k'])});
 const cuenta=(a,b,tp)=>ev.filter(([m,k])=>k===tp&&m>=a&&m<b).length;
 const labels=[],cre=Array(dias).fill(0),cer=Array(dias).fill(0);
 for(let i=0;i<dias;i++)labels.push(new Date(desde+i*DAY).toLocaleDateString('es-MX',{day:'numeric',month:'short'}));
 ev.forEach(([m,k])=>{if(m>=desde&&m<hoyI+DAY){const i=Math.floor((inicioDia(m)-desde)/DAY);(k==='c'?cre:cer)[i]++}});
 const resP=T.filter(t=>t.estado==='resuelto'&&t.cerrado&&t.cerrado>=desde);
 const enSla=resP.filter(t=>t.cerrado<=t.sla).length;
 const act=T.filter(activo);
 return{labels,cre,cer,
  cerP:cuenta(desde,hoyI+DAY,'k'),cerA:cuenta(desdeAnt,desde,'k'),creP:cuenta(desde,hoyI+DAY,'c'),creA:cuenta(desdeAnt,desde,'c'),
  nRes:resP.length,enSla,sla:resP.length?Math.round(enSla/resP.length*100):null,
  tiempo:resP.length?resP.reduce((a,t)=>a+(t.cerrado-(t.creado||t.cerrado)),0)/resP.length:0,
  urg:act.filter(t=>t.urgencia<=2).length,act,now}
}
/* Variación contra el periodo anterior (más cerrados es bueno; más levantados solo informa) */
function delta(a,b,bueno=true){
 if(!a&&!b)return'<span class="dl nu">Sin movimiento</span>';
 if(!b)return`<span class="dl up">▲ nuevo</span> <span>vs. periodo previo</span>`;
 const p=Math.round((a-b)/b*100);if(p===0)return'<span class="dl nu">= igual</span> <span>que el periodo previo</span>';
 const up=p>0,cls=bueno?(up?'up':'dn'):'nu';
 return`<span class="dl ${cls}">${up?'▲':'▼'} ${Math.abs(p)}%</span> <span>vs. periodo previo</span>`}

function renderDashboard(){
 const s=stats(),first=USERS[S.user].n.split(' ')[0],A=analisis(s,dashDias),top=A.act.sort((a,b)=>a.sla-b.sla).slice(0,5);
 const mods=DB.get('modulos',[]),pAb=s.p.filter(p=>p.estado!=='atendido');
 const slaC=A.sla===null?'#64748b':A.sla>=90?'#10b981':A.sla>=75?'#f59e0b':'#ef4444';
 /* [etiqueta, valor, ícono, color, detalle, ¿cuenta animada?] */
 const kp=[
  ['Pendientes',s.pend,'alert-triangle','#ef4444',`${A.urg} activos con urgencia crítica o alta`,1],
  ['En proceso',s.proc,'clock','#f59e0b','Tickets y puntos 5S en atención',1],
  [`Cerrados · ${dashDias} días`,A.cerP,'check-circle-2','#10b981',delta(A.cerP,A.cerA),1],
  ['SLA vencidos',s.over,'timer-off','#ef4444',`de ${A.act.length} tickets activos`,1],
  ['Cumplimiento SLA',A.sla===null?'—':A.sla+'%','shield-check',slaC,A.nRes?`${A.enSla} de ${A.nRes} tickets resueltos a tiempo`:'Sin tickets resueltos en el periodo',0],
  ['Resolución media',fmtDur(A.tiempo),'timer','#2563eb','Promedio por ticket resuelto',0]];
 const pr=dashDias;
 $('#v-dashboard').classList.toggle('still',!dashAnim);
 $('#v-dashboard').innerHTML=`
 <div class="ph"><div><h2>Hola, ${esc(first)}</h2><p>${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})} · ${s.total} registros en el sistema</p></div>
  <div class="acts"><div class="seg" role="group" aria-label="Periodo de análisis">${DIAS.map(([d,l])=>`<button class="${d===pr?'on':''}" onclick="dashPeriodo(${d})">${l}</button>`).join('')}</div>
  <button class="btn b-amb" onclick="tkNuevo()"><i data-lucide="alert-circle"></i>Reportar ticket</button></div></div>
 <div class="kpis">${kp.map(([l,v,i,c,d,n])=>`<div class="kpi" style="--c:${c}"><div class="kt"><small>${l}</small><i data-lucide="${i}"></i></div><b ${n?`data-n="${v}"`:''}>${n?(dashAnim?0:v):esc(v)}</b><span class="ks">${d}</span></div>`).join('')}</div>
 <div class="g12">
  <div class="card s8"><div class="chd"><div><h4>Actividad del equipo</h4><p>Registros levantados y cerrados por día · tickets y puntos 5S · últimos ${pr} días</p></div></div><div class="ch tall"><canvas id="c0"></canvas></div></div>
  <div class="card s4"><div class="chd"><div><h4>Estado general</h4><p>Distribución de todos los registros</p></div></div><div class="ch tall"><canvas id="c1"></canvas></div></div>
 </div>
 <div class="g12">
  <div class="card s5"><div class="chd"><div><h4>Atención inmediata</h4><p>Tickets activos ordenados por tiempo límite</p></div></div>${top.length?top.map(t=>`<div class="urow" style="--c:${URG[t.urgencia].c}" onclick="tkF='activos';go('tickets')"><div><b>${esc(t.id)} · ${esc(t.resumen)}</b><span class="mu sm">${esc(t.modulo)} · ${URG[t.urgencia].n} (${URG[t.urgencia].t})</span></div>${slaHtml(t)}</div>`).join(''):'<p class="empty">No hay tickets activos. Todo al corriente.</p>'}</div>
  <div class="card s7"><div class="chd"><div><h4>Carga de trabajo por módulo</h4><p>Tickets activos y puntos 5S sin cerrar</p></div></div><div class="ch"><canvas id="c3"></canvas></div></div>
 </div>
 <div class="g12">
  <div class="card s8"><div class="chd"><div><h4>Productividad por persona</h4><p>Puntos 5S atendidos y tickets resueltos · semana inicia en lunes</p></div></div><div class="ch"><canvas id="c4"></canvas></div></div>
  <div class="card s4"><div class="chd"><div><h4>Avance 5S por módulo</h4><p>Puntos resueltos sobre el total levantado</p></div></div>${mods.length?mods.map(m=>{const ps=s.p.filter(p=>p.modulo===m),ok=ps.filter(p=>p.estado==='atendido').length,pc=ps.length?Math.round(ok/ps.length*100):0;
   return`<div class="mrow"><div><b>${esc(m)}</b><span class="mu sm">${ok}/${ps.length} · ${pc}%</span></div><div class="bar"><i class="${pc===100&&ps.length?'ok':''}" style="width:${dashAnim?0:pc}%" data-w="${pc}"></i></div></div>`}).join(''):'<p class="empty">Aún no hay módulos.</p>'}</div>
 </div>
 <div class="g12">
  <div class="card s6"><div class="chd"><div><h4>Tickets activos por urgencia</h4><p>Cuántos faltan por atender en cada nivel</p></div></div><div class="ch"><canvas id="c2"></canvas></div></div>
  <div class="card s6"><div class="chd"><div><h4>Puntos 5S abiertos por criticidad</h4><p>Del nivel 1 (baja) al 5 (crítica)</p></div></div><div class="ch"><canvas id="c5"></canvas></div></div>
 </div>`;
 $$('#v-dashboard [data-n]').forEach(e=>dashAnim?countTo(e,+e.dataset.n):e.textContent=e.dataset.n);
 if(dashAnim)requestAnimationFrame(()=>$$('#v-dashboard [data-w]').forEach(e=>e.style.width=e.dataset.w+'%'));
 drawCharts(s,A,mods,pAb);dashAnim=false;
}
function dashPeriodo(d){dashDias=d;dashAnim=false;renderDashboard();icons()}

function drawCharts(s,A,mods,pAb){
 if(!window.Chart)return;charts.forEach(c=>c.destroy());
 const mu=cv('--mu'),tx=cv('--tx'),grid=cv('--grid'),card=cv('--p'),dark=temaActual()==='dark';
 Chart.defaults.color=mu;Chart.defaults.font.family='-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif';Chart.defaults.font.size=12;
 const anim=dashAnim?{duration:700,easing:'easeOutQuart'}:false;
 const tip={backgroundColor:dark?'#1f2a45':'#0f172a',titleColor:'#fff',bodyColor:'#e2e8f0',padding:10,cornerRadius:8,boxPadding:4,usePointStyle:true,borderColor:dark?'#2c3a5c':'transparent',borderWidth:1};
 const leg={position:'bottom',labels:{usePointStyle:true,pointStyle:'rectRounded',boxWidth:8,boxHeight:8,padding:16}};
 const base={responsive:true,maintainAspectRatio:false,animation:anim,interaction:{mode:'index',intersect:false}};
 const ax={grid:{color:grid},border:{display:false},ticks:{precision:0},beginAtZero:true},nogrid={grid:{display:false},border:{color:grid}};
 const act=s.t.filter(activo),azul='#2563eb',verde='#10b981',lila='#8b5cf6';
 /* Texto central de la dona: total de registros */
 const centro={id:'centro',afterDraw(c){const m=c.getDatasetMeta(0).data[0];if(!m)return;const x=c.ctx,t=c.data.datasets[0].data.reduce((a,b)=>a+b,0);
  x.save();x.textAlign='center';x.textBaseline='middle';x.fillStyle=tx;x.font='650 26px '+Chart.defaults.font.family;x.fillText(t,m.x,m.y-6);x.fillStyle=mu;x.font='12px '+Chart.defaults.font.family;x.fillText('registros',m.x,m.y+16);x.restore()}};
 const stk=(l,d,c)=>({label:l,data:d,backgroundColor:c,borderRadius:4,borderSkipped:false,maxBarThickness:28});
 charts=[
  new Chart($('#c0'),{type:'line',data:{labels:A.labels,datasets:[
   {label:'Levantados',data:A.cre,borderColor:azul,backgroundColor:azul+'1f',fill:true,cubicInterpolationMode:'monotone',tension:.3,borderWidth:2,pointRadius:A.labels.length>31?0:3,pointHoverRadius:5,pointBackgroundColor:card,pointBorderWidth:2},
   {label:'Cerrados',data:A.cer,borderColor:verde,backgroundColor:verde+'14',fill:true,cubicInterpolationMode:'monotone',tension:.3,borderWidth:2,pointRadius:A.labels.length>31?0:3,pointHoverRadius:5,pointBackgroundColor:card,pointBorderWidth:2}]},
   options:{...base,plugins:{legend:leg,tooltip:tip},scales:{x:{...nogrid,ticks:{maxTicksLimit:10,maxRotation:0}},y:ax}}}),
  new Chart($('#c1'),{type:'doughnut',data:{labels:['Pendientes','En proceso','Resueltos','Rechazados'],datasets:[{data:[s.pend,s.proc,s.ok,s.rej],backgroundColor:['#ef4444','#f59e0b','#10b981','#94a3b8'],borderColor:card,borderWidth:3,hoverOffset:4}]},
   options:{responsive:true,maintainAspectRatio:false,animation:anim,cutout:'72%',plugins:{legend:leg,tooltip:tip}},plugins:[centro]}),
  new Chart($('#c2'),{type:'bar',data:{labels:Object.values(URG).map(u=>u.n),datasets:[{data:Object.keys(URG).map(k=>act.filter(t=>t.urgencia==k).length),backgroundColor:Object.values(URG).map(u=>u.c),borderRadius:6,borderSkipped:false,maxBarThickness:46}]},
   options:{...base,plugins:{legend:{display:false},tooltip:{...tip,callbacks:{label:c=>` ${c.parsed.y} tickets activos`}}},scales:{x:nogrid,y:ax}}}),
  new Chart($('#c3'),{type:'bar',data:{labels:mods,datasets:[stk('Tickets activos',mods.map(m=>act.filter(t=>t.modulo===m).length),azul),stk('Puntos 5S sin cerrar',mods.map(m=>pAb.filter(p=>p.modulo===m).length),lila)]},
   options:{...base,indexAxis:'y',plugins:{legend:leg,tooltip:tip},scales:{x:{...ax,stacked:true},y:{...nogrid,stacked:true}}}}),
  cierresChart(s,{base,ax,nogrid,leg,tip,azul,lila,verde}),
  new Chart($('#c5'),{type:'bar',data:{labels:['Nivel 1','Nivel 2','Nivel 3','Nivel 4','Nivel 5','Sin asignar'],datasets:[{data:[1,2,3,4,5].map(n=>pAb.filter(p=>p.criticidad===n).length).concat(pAb.filter(p=>!p.criticidad).length),backgroundColor:[1,2,3,4,5].map(n=>PCRIT[n]).concat('#94a3b8'),borderRadius:6,borderSkipped:false,maxBarThickness:46}]},
   options:{...base,plugins:{legend:{display:false},tooltip:{...tip,callbacks:{label:c=>` ${c.parsed.y} puntos abiertos`}}},scales:{x:nogrid,y:ax}}})];
}

/* Cierres por persona: puntos 5S atendidos + tickets resueltos (semana inicia en lunes) */
function cierresChart(s,o){
 const n=new Date(),hoyS=hoy(),iniS=hoy(new Date(n.getFullYear(),n.getMonth(),n.getDate()-(n.getDay()+6)%7)),mesS=hoyS.slice(0,7),r={};
 usersRol(['admin','comun']).forEach(([e])=>r[e]=[0,0,0]);
 const add=(u,f)=>{if(!u||!f)return;const x=r[u]=r[u]||[0,0,0];if(f===hoyS)x[0]++;if(f>=iniS&&f<=hoyS)x[1]++;if(f.slice(0,7)===mesS)x[2]++};
 s.p.filter(p=>p.estado==='atendido').forEach(p=>add(p.usuarioCierra,p.fechaCumplido));
 s.t.filter(t=>t.estado==='resuelto').forEach(t=>add(t.cierra,t.cerrado&&hoy(new Date(t.cerrado))));
 const k=Object.keys(r),ds=(l,i,c)=>({label:l,data:k.map(e=>r[e][i]),backgroundColor:c,borderRadius:4,borderSkipped:false,maxBarThickness:26});
 return new Chart($('#c4'),{type:'bar',data:{labels:k.map(nom),datasets:[ds('Hoy',0,o.azul),ds('Esta semana',1,o.lila),ds('Este mes',2,o.verde)]},options:{...o.base,plugins:{legend:o.leg,tooltip:o.tip},scales:{x:o.nogrid,y:o.ax}}});
}
</script>
<script>
/* ===== Tickets: lista, urgencia/SLA, asignar, resolver, rechazar, detalle ===== */
let tkF='activos',tkQ='';
const TKF={activos:activo,abierto:t=>t.estado==='abierto',asignado:t=>t.estado==='asignado',resuelto:t=>t.estado==='resuelto',rechazado:t=>t.estado==='rechazado',revocado:t=>t.estado==='revocado',todos:()=>true};
const TKL={activos:'Activos',abierto:'Abiertos',asignado:'Asignados',resuelto:'Resueltos',rechazado:'Rechazados',revocado:'Revocados',todos:'Todos'};

function renderTickets(){
 const all=DB.get('tickets',[]);
 $('#v-tickets').innerHTML=`
 <div class="ph"><div><h2>Tickets y hallazgos</h2><p>Atención priorizada por nivel de urgencia y tiempo límite (SLA)</p></div><button class="btn b-amb" onclick="tkNuevo()"><i data-lucide="plus"></i>Nuevo ticket</button></div>
 <div class="scale">${Object.values(URG).map(u=>`<span style="--c:${u.c}"><i class="dot"></i>${u.n} · ${u.t}</span>`).join('')}</div>
 <div class="card flush"><div class="tb"><div class="chips">${Object.keys(TKF).map(k=>`<button class="${k===tkF?'on':''}" onclick="tkF='${k}';renderTickets();icons()">${TKL[k]}<em>${all.filter(TKF[k]).length}</em></button>`).join('')}</div>
 <input class="search" placeholder="Buscar folio, resumen, módulo…" value="${esc(tkQ)}" oninput="tkQ=this.value;drawTickets()"></div>
 <div class="tw"><table><thead><tr><th>Folio</th><th>Resumen</th><th>Módulo</th><th>Urgencia / tiempo límite</th><th>Asignado</th><th>Estado</th><th></th></tr></thead><tbody id="tkBody"></tbody></table></div></div>`;
 drawTickets();
}
function drawTickets(){
 const q=tkQ.toLowerCase(),can=puedeGestionar(),ic=(i,tip,fn,c='')=>`<button class="ib ${c}" title="${tip}" onclick="${fn}"><i data-lucide="${i}"></i></button>`;
 const rows=DB.get('tickets',[]).filter(TKF[tkF]).filter(t=>!q||[t.id,t.resumen,t.modulo,t.comentario].join(' ').toLowerCase().includes(q))
  .sort((a,b)=>(activo(b)-activo(a))||(activo(a)?a.sla-b.sla:b.creado-a.creado));
 $('#tkBody').innerHTML=rows.length?rows.map((t,i)=>`<tr class="row" style="animation-delay:${Math.min(i,10)*35}ms">
  <td class="mono acc">${esc(t.id)}</td>
  <td><span class="badge" style="--c:var(--pri)"><i data-lucide="box"></i>${esc(t.modulo)}</span> <b>${esc(t.resumen)}</b><div class="mu sm">${esc(t.comentario)}</div><div class="sm mu">Reportó: ${esc(nom(t.usuarioReporta))}</div>${t.estado==='rechazado'?`<div class="sm" style="color:var(--bad)">Motivo: ${esc(t.motivoRechazo)}</div>`:''}</td>
  <td>${esc(t.modulo)}</td>
  <td>${urgB(t.urgencia)}<div class="sm mu">Atender en: ${URG[t.urgencia].t}</div>${slaHtml(t)}</td>
  <td>${t.usuarioAsignado?esc(nom(t.usuarioAsignado)):'<span class="warn-t">Sin asignar</span>'}</td>
  <td>${badge(t.estado)}${t.estado==='asignado'&&t.avance==='en_proceso'?'<div class="sm" style="color:var(--warn)">▶ En proceso</div>':''}</td>
  <td class="ra">${ic('eye','Detalle',`tkDetalle('${t.id}')`)}${can&&activo(t)&&t.usuarioReporta===S.user?ic('pencil','Editar mi ticket',`tkEditar('${t.id}')`)+ic('trash-2','Eliminar mi ticket',`tkEliminar('${t.id}')`,'no'):''}${can&&t.estado==='asignado'&&t.avance!=='en_proceso'&&(t.usuarioAsignado===S.user||esAdmin())?ic('play','Marcar en proceso',`tkProceso('${t.id}')`):''}${can&&activo(t)?ic('user-check',t.estado==='abierto'?'Tomar / asignar':'Reasignar / cambiar urgencia',`tkAsignar('${t.id}')`)+ic('check','Resolver',`tkResolver('${t.id}')`,'ok')+(t.usuarioReporta!==S.user?ic('x','Rechazar',`tkRechazar('${t.id}')`,'no'):''):''}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">Sin tickets en esta vista</td></tr>`;
 icons();
}
function tkMut(id,fn){const a=DB.get('tickets',[]),t=a.find(x=>x.id===id);if(!t)return;fn(t);DB.set('tickets',a);renderAll()}

function tkNuevo(){
 openModal({title:'Reportar ticket / hallazgo',icon:'alert-circle',cls:'b-amb',ok:'Emitir ticket',
  body:fld('Módulo afectado',`<select id="f_mod">${opts(DB.get('modulos',[]).map(m=>[m,m]))}</select>`)+fld('Resumen',`<input id="f_res" placeholder="Ej. Fuga de aire comprimido en jaula B">`)+fld('Detalles del hallazgo',`<textarea id="f_det" rows="3" placeholder="Describe la afectación para que el equipo pueda atenderla"></textarea>`)+urgPick(3),
  onOk(){
   const resumen=$('#f_res').value.trim(),comentario=$('#f_det').value.trim();
   if(!resumen||!comentario){toast('Completa el resumen y los detalles','err');return false}
   const id=tkCrear($('#f_mod').value,resumen,comentario,urgVal());toast('Ticket '+id+' emitido','ok');tkF='activos';renderAll();
  }});
}
/* Alta de ticket compartida por el modal de gestores y el portal del reportero */
function tkCrear(modulo,resumen,comentario,u){
 const a=DB.get('tickets',[]),now=Date.now();let id;do{id='TK-'+Math.floor(1000+Math.random()*9000)}while(a.some(t=>t.id===id));
 const t={id,modulo,resumen,comentario,usuarioReporta:S.user,usuarioAsignado:null,estado:'abierto',urgencia:u,creado:now,slaIni:now,sla:calcSla(now,u),hist:[]};
 addHist(t,'Ticket creado · Urgencia '+URG[u].n+' ('+URG[u].t+')');a.unshift(t);DB.set('tickets',a);
 notifyRoles(['admin','comun'],`${u<=2?'🚨 ':''}Nuevo ticket ${id} (${URG[u].n}, atender en ${URG[u].t}) · ${modulo} · levantó ${nom(S.user)}: ${resumen}`);
 return id;
}
function tkVigente(id){const f=DB.get('tickets',[]).find(x=>x.id===id);if(f&&activo(f))return true;toast('Este ticket ya fue cerrado o revocado por alguien más','err');renderAll();return false}
function tkAsignar(id){
 const t=DB.get('tickets',[]).find(x=>x.id===id),est0=t.estado,lista=esAdmin()?usersRol(['admin','comun']):[[S.user,nom(S.user)+' (yo)']];
 openModal({title:`Asignar ${esc(id)}`,icon:'user-check',ok:'Guardar asignación',
 body:`<p class="mu sm">${esc(t.resumen)}</p>`+fld('Asignar a',`<select id="f_asg">${opts(lista,t.usuarioAsignado||S.user)}</select>`)+urgPick(t.urgencia),
 onOk(){const asg=$('#f_asg').value,u=urgVal();
  if(!tkVigente(id))return;
  const f=DB.get('tickets',[]).find(x=>x.id===id);if(est0==='abierto'&&f.estado!=='abierto'){toast('Ya lo tomó '+nom(f.usuarioAsignado)+'. La lista se actualizó','err');renderAll();return}
  tkMut(id,t=>{if(u!==t.urgencia){addHist(t,`Urgencia: ${URG[t.urgencia].n} → ${URG[u].n}`);t.urgencia=u;t.slaIni=Date.now();t.sla=calcSla(t.slaIni,u);t.alertado=0}
   if(t.estado==='abierto'||t.usuarioAsignado!==asg)t.avance=null;t.usuarioAsignado=asg;t.estado='asignado';addHist(t,'Asignado a '+nom(asg)+' · límite '+fmtD(t.sla));
   notify(t.usuarioReporta,`Tu ticket ${t.id} fue asignado a ${nom(asg)}. Atención antes de: ${fmtD(t.sla)}`);if(asg!==S.user)notify(asg,`Se te asignó ${t.id} (${URG[u].n}): ${t.resumen}`)});
  toast('Ticket asignado','ok')}});
}
function tkResolver(id){
 const t=DB.get('tickets',[]).find(x=>x.id===id);
 openModal({title:`Resolver ${esc(id)}`,icon:'check-circle-2',cls:'b-ok',ok:'Marcar como resuelto',
 body:`<p class="mu sm">${esc(t.resumen)}</p>`+fld('¿Qué se hizo para resolverlo?',`<textarea id="f_sol" rows="3"></textarea>`)+fld('¿Alguien apoyó en el cierre?',`<input id="f_apo" placeholder="Nombres (opcional)">`),
 onOk(){const sol=$('#f_sol').value.trim(),apo=$('#f_apo').value.trim();
  if(!tkVigente(id))return;tkMut(id,t=>{t.estado='resuelto';t.cierra=S.user;t.solucion=sol;t.apoyo=apo;t.cerrado=Date.now();addHist(t,'Resuelto'+(sol?': '+sol:'')+(apo?' · apoyo: '+apo:''));notify(t.usuarioReporta,`Tu ticket ${t.id} fue resuelto por ${nom(S.user)}.`)});
  toast('Ticket resuelto','ok')}});
}
function tkRechazar(id){
 const t=DB.get('tickets',[]).find(x=>x.id===id);
 openModal({title:`Rechazar ${esc(id)}`,icon:'ban',cls:'b-no',ok:'Rechazar ticket',
 body:`<p class="mu sm">${esc(t.resumen)}</p>`+fld('Motivo del rechazo',`<select id="f_mot">${opts(MOTIVOS.map(m=>[m,m]))}</select>`)+fld('Explicación (obligatoria si el motivo es “Otro”)',`<textarea id="f_exp" rows="3" placeholder="Opcional: da contexto a quien reportó"></textarea>`),
 onOk(){const m=$('#f_mot').value,e=$('#f_exp').value.trim();
  if(m==='Otro'&&!e){toast('Explica el motivo del rechazo','err');return false}
  if(!tkVigente(id))return;tkMut(id,t=>{t.estado='rechazado';t.motivoRechazo=m+(e?' — '+e:'');t.rechazadoPor=S.user;t.cerrado=Date.now();addHist(t,'Rechazado: '+t.motivoRechazo);notify(t.usuarioReporta,`Tu ticket ${t.id} fue rechazado por ${nom(S.user)}. Motivo: ${t.motivoRechazo}`)});
  toast('Ticket rechazado y reportero notificado')}});
}
function tkDetalle(id){
 const t=DB.get('tickets',[]).find(x=>x.id===id);if(!t)return;
 openModal({title:`${esc(t.id)} · ${esc(t.resumen)}`,icon:'ticket',
 body:`<div style="display:flex;gap:8px;flex-wrap:wrap">${badge(t.estado)}${urgB(t.urgencia)}<span class="badge">${esc(t.modulo)}</span></div><p>${esc(t.comentario)}</p>
 <div class="sm mu">Reportó: ${esc(nom(t.usuarioReporta))} · Asignado: ${esc(nom(t.usuarioAsignado))} · Límite: ${fmtD(t.sla)} ${slaHtml(t)}</div>
 ${t.estado==='rechazado'?`<div class="rej"><b>Rechazado por ${esc(nom(t.rechazadoPor))}</b><br>${esc(t.motivoRechazo)}</div>`:''}
 <div class="tl">${(t.hist||[]).map(h=>`<div>${esc(h.txt)}<small>${fmtD(h.t)} · ${esc(nom(h.u))}</small></div>`).join('')}</div>`});
}

/* Editar / eliminar: solo admin y usuario común, y solo tickets propios que sigan activos */
function tkEditar(id){
 const t=DB.get('tickets',[]).find(x=>x.id===id);if(!t)return;
 openModal({title:`Editar ${esc(id)}`,icon:'pencil',ok:'Guardar cambios',
 body:fld('Módulo',`<select id="f_mod">${opts(DB.get('modulos',[]).map(m=>[m,m]),t.modulo)}</select>`)+fld('Resumen',`<input id="f_res" value="${esc(t.resumen)}">`)+fld('Detalles',`<textarea id="f_det" rows="3">${esc(t.comentario)}</textarea>`)+urgPick(t.urgencia),
 onOk(){const r=$('#f_res').value.trim(),d=$('#f_det').value.trim(),u=urgVal();if(!r||!d){toast('Completa resumen y detalles','err');return false}
  tkMut(id,k=>{k.modulo=$('#f_mod').value;k.resumen=r;k.comentario=d;if(u!==k.urgencia){addHist(k,`Urgencia: ${URG[k.urgencia].n} → ${URG[u].n}`);k.urgencia=u;k.slaIni=Date.now();k.sla=calcSla(k.slaIni,u);k.alertado=0}addHist(k,'Editado por su autor')});toast('Ticket actualizado','ok')}});
}
function tkEliminar(id){
 openModal({title:`Eliminar ${esc(id)}`,icon:'trash-2',cls:'b-no',ok:'Eliminar',body:'<p>El ticket se eliminará de forma permanente.</p>',
 onOk(){DB.set('tickets',DB.get('tickets',[]).filter(t=>t.id!==id));toast('Ticket eliminado');renderAll()}});
}

/* Quien atiende marca que ya empezó: el reportero lo ve como "En proceso" (antes: "Recién asignado") */
function tkProceso(id){
 tkMut(id,t=>{if(t.estado!=='asignado')return;t.avance='en_proceso';addHist(t,'En proceso: '+nom(S.user)+' inició la atención');notify(t.usuarioReporta,`Tu ticket ${t.id} ya está en proceso (${nom(t.usuarioAsignado)}).`)});
 toast('Ticket marcado en proceso','ok');
}

/* Revocar: solo quien lo reportó y únicamente mientras nadie lo haya aceptado (estado "abierto") */
function tkRevocar(id){
 const t0=DB.get('tickets',[]).find(x=>x.id===id);
 if(!t0||t0.usuarioReporta!==S.user)return;
 if(t0.estado!=='abierto')return toast('Este ticket ya fue aceptado, ya no se puede revocar','err');
 openModal({title:`Revocar ${esc(id)}`,icon:'undo-2',cls:'b-no',ok:'Revocar ticket',
  body:`<p class="mu sm">${esc(t0.resumen)}</p><p>El ticket se retira y nadie lo atenderá. Solo es posible mientras no haya sido aceptado.</p>`+fld('Motivo (opcional)',`<textarea id="f_rev" rows="2" placeholder="Ej. Ya se resolvió solo / lo levanté por error"></textarea>`),
  onOk(){
   const m=$('#f_rev').value.trim();
   const t=DB.get('tickets',[]).find(x=>x.id===id);
   if(!t||t.estado!=='abierto'){toast('Alguien acaba de aceptarlo, ya no se puede revocar','err');renderAll();return}
   tkMut(id,k=>{k.estado='revocado';k.revocado=Date.now();k.motivoRevoca=m||null;addHist(k,'Revocado por quien lo reportó antes de ser aceptado'+(m?': '+m:''));
    notifyRoles(['admin','comun'],`El ticket ${k.id} fue revocado por ${nom(S.user)}${m?': '+m:''}`)});
   toast('Ticket revocado','ok');
  }});
}
</script>
<script>
/* ===== Puntos 5S: módulos, mis tareas, asignación (admin) ===== */
function renderSide(){$('#sideMods').innerHTML=DB.get('modulos',[]).map(m=>`<div class="sm1"><i data-lucide="cpu"></i>${esc(m)}</div>`).join('')}
function renderBadges(){const s=stats();$('#bTk').textContent=s.t.filter(activo).length;$('#bTareas').textContent=misPend().length}

/* Lo activo de un módulo: puntos 5S sin cerrar + tickets abiertos/asignados */
const modActivos=m=>[
 ...DB.get('puntos',[]).filter(p=>p.modulo===m&&p.estado!=='atendido').map(p=>({k:'p',x:p,asig:p.usuarioAsignado,fecha:p.fechaLevantamiento,txt:p.descripcion})),
 ...DB.get('tickets',[]).filter(t=>t.modulo===m&&activo(t)).map(t=>({k:'t',x:t,asig:t.usuarioAsignado,fecha:fmtD(t.creado),txt:t.resumen}))
].sort((a,b)=>(!!a.asig-!!b.asig)||String(a.fecha).localeCompare(String(b.fecha)));

function renderModulos(){
 const P=DB.get('puntos',[]);
 $('#v-modulos').innerHTML=`<div class="ph"><div><h2>Módulos de pruebas L10</h2><p>Todo lo activo por módulo y a quién está cargado · lo que parpadea en amarillo aún no tiene responsable</p></div><div class="acts"><button class="btn" onclick="modNuevo()"><i data-lucide="plus"></i>Nuevo módulo</button></div></div>
 <div class="stack">${DB.get('modulos',[]).map(m=>{const ps=P.filter(p=>p.modulo===m),ok=ps.filter(p=>p.estado==='atendido').length,pc=ps.length?Math.round(ok/ps.length*100):0,
 act=modActivos(m),sin=act.filter(a=>!a.asig).length;
 return`<div class="card"><div class="ch2"><h4><i data-lucide="box"></i>${esc(m)}</h4><span class="mu sm">${act.length} activo(s)${sin?` · <b class="warn-t">${sin} sin asignar</b>`:''} · ${ok}/${ps.length} puntos 5S resueltos · ${pc}%</span></div><div class="bar"><i style="width:0" data-w="${pc}"></i></div>
 <div class="tw"><table><thead><tr><th>Tipo</th><th>Detalle</th><th>Levantado por</th><th>Fecha</th><th>Cargado a</th><th>Estado</th><th></th></tr></thead><tbody>${act.length?act.map(a=>modFila(a)).join(''):'<tr><td colspan="7" class="empty">Sin pendientes activos</td></tr>'}</tbody></table></div></div>`}).join('')}</div>`;
 requestAnimationFrame(()=>$$('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'));
}
function modFila(a){
 const x=a.x,esP=a.k==='p',sin=!a.asig,ib=(i,tip,fn,c='')=>`<button class="ib ${c}" title="${tip}" onclick="${fn}"><i data-lucide="${i}"></i></button>`;
 const quien=esP?x.usuarioLevanta:x.usuarioReporta;
 let acc='';
 if(sin&&(esP?esAdmin():puedeGestionar()))acc+=`<button class="btn b-amb" onclick="${esP?`ptAsignar('${x.id}')`:`tkAsignar('${x.id}')`}"><i data-lucide="user-plus"></i>Asignar</button>`;
 if(esP){if(ptMio(x))acc+=ib('pencil','Editar mi punto',`ptEditar('${x.id}')`)+ib('trash-2','Eliminar mi punto',`ptEliminar('${x.id}')`,'no');acc+=ib('check','Cerrar',`ptCerrar('${x.id}')`,'ok')}
 else acc+=ib('eye','Detalle',`tkDetalle('${x.id}')`);
 return`<tr class="row${sin?' sin-asig':''}"><td><span class="badge" style="--c:${esP?'var(--pri)':URG[x.urgencia].c}">${esP?'Punto 5S':'Ticket '+esc(x.id)}</span></td><td><b>${esc(a.txt)}</b></td><td class="mu">${esc(nom(quien))}</td><td class="mono mu">${esc(a.fecha)}</td><td>${sin?'<span class="warn-t">Sin asignar</span>':esc(nom(a.asig))}</td><td>${badge(esP?x.estado:x.estado)}</td><td class="ra">${acc}</td></tr>`;
}

/* Mis tareas: pendientes (puntos 5S y tickets cargados al usuario) y terminadas */
const misPend=()=>[
 ...DB.get('puntos',[]).filter(p=>p.usuarioAsignado===S.user&&p.estado!=='atendido').map(p=>({k:'p',x:p})),
 ...DB.get('tickets',[]).filter(t=>t.usuarioAsignado===S.user&&t.estado==='asignado').map(t=>({k:'t',x:t}))];
const misTerm=()=>[
 ...DB.get('puntos',[]).filter(p=>p.estado==='atendido'&&(p.usuarioAsignado===S.user||p.usuarioCierra===S.user)).map(p=>({k:'p',x:p,f:p.fechaCumplido||''})),
 ...DB.get('tickets',[]).filter(t=>t.estado==='resuelto'&&(t.usuarioAsignado===S.user||t.cierra===S.user)).map(t=>({k:'t',x:t,f:t.cerrado?hoy(new Date(t.cerrado)):''}))
].sort((a,b)=>String(b.f).localeCompare(String(a.f)));

function renderTareas(){
 const mis=misPend().sort((a,b)=>{const fa=a.k==='p'?(a.x.fechaLimite||'9'):hoy(new Date(a.x.sla)),fb=b.k==='p'?(b.x.fechaLimite||'9'):hoy(new Date(b.x.sla));return fa.localeCompare(fb)});
 const ter=misTerm();
 const pend=mis.length?mis.map((a,i)=>{const p=a.x;
  if(a.k==='t')return`<tr class="row" style="animation-delay:${i*40}ms"><td>${urgB(p.urgencia)}</td><td>${esc(p.modulo)}</td><td><b>${esc(p.resumen)}</b><div class="sm mu">Ticket ${esc(p.id)}</div></td><td class="mu">${esc(nom(p.usuarioReporta))}</td><td class="mono">${esc(fmtD(p.sla))}${slaHtml(p)}</td><td>${badge(p.estado)}${p.avance==='en_proceso'?'<div class="sm" style="color:var(--warn)">▶ En proceso</div>':''}</td><td class="ra"><button class="ib" title="Detalle" onclick="tkDetalle('${p.id}')"><i data-lucide="eye"></i></button>${puedeGestionar()?`<button class="ib ok" title="Resolver" onclick="tkResolver('${p.id}')"><i data-lucide="check"></i></button>`:''}</td></tr>`;
  const d=p.fechaLimite?Math.ceil((new Date(p.fechaLimite+'T23:59:59')-Date.now())/864e5):null;
  return`<tr class="row" style="animation-delay:${i*40}ms"><td><span class="crit" style="--c:${PCRIT[p.criticidad||1]}">Nivel ${p.criticidad||1}</span></td><td>${esc(p.modulo)}</td><td><b>${esc(p.descripcion)}</b><div class="sm mu">Punto 5S</div></td><td class="mu">${esc(nom(p.usuarioLevanta))}</td><td class="mono">${esc(p.fechaLimite||'Sin límite')}${d!==null?`<div class="sm" style="color:${d<0?'var(--bad)':d<=1?'var(--warn)':'var(--good)'}">${d<0?'Vencida':d===0?'Vence hoy':'En '+d+' día(s)'}</div>`:''}</td><td>${badge(p.estado)}</td><td class="ra"><button class="ib ok" title="Cerrar" onclick="ptCerrar('${p.id}')"><i data-lucide="check"></i></button></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No tienes tareas pendientes</td></tr>';
 const term=ter.length?ter.map((a,i)=>{const p=a.x,esP=a.k==='p';
  return`<tr class="row" style="animation-delay:${Math.min(i,10)*30}ms"><td><span class="badge" style="--c:var(--good)">${esP?'Punto 5S':'Ticket '+esc(p.id)}</span></td><td>${esc(p.modulo)}</td><td><b>${esc(esP?p.descripcion:p.resumen)}</b></td><td class="mu">${esc(nom(esP?p.usuarioLevanta:p.usuarioReporta))}</td><td class="mono">${esc(a.f||'—')}</td><td class="ra">${esP?'':`<button class="ib" title="Detalle" onclick="tkDetalle('${p.id}')"><i data-lucide="eye"></i></button>`}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Aún no has terminado tareas</td></tr>';
 $('#v-tareas').innerHTML=`<div class="ph"><div><h2>Mis tareas asignadas</h2><p>Tus pendientes ordenados por fecha límite · criticidad de 1 (baja) a 5 (crítica)</p></div></div>
 <div class="card flush"><div class="tw"><table><thead><tr><th>Criticidad / urgencia</th><th>Módulo</th><th>Tarea</th><th>Levantó</th><th>Fecha límite</th><th>Estado</th><th></th></tr></thead><tbody>${pend}</tbody></table></div></div>
 <div class="ph" style="margin-top:26px"><div><h2>Tareas terminadas</h2><p>Todo lo que ya cumpliste · ${ter.length} en total</p></div></div>
 <div class="card flush"><div class="tw"><table><thead><tr><th>Tipo</th><th>Módulo</th><th>Tarea</th><th>Levantó</th><th>Cumplida</th><th></th></tr></thead><tbody>${term}</tbody></table></div></div>`;
}
function renderAdmin(){
 if(!esAdmin()){$('#v-admin').innerHTML=`<div class="ph"><div><h2>Asignación de tareas</h2></div></div><div class="lock"><i data-lucide="shield-alert"></i>Acceso restringido. Cambia al rol Admin para asignar tareas.</div>`;return}
 const sin=DB.get('puntos',[]).filter(p=>!p.usuarioAsignado&&p.estado!=='atendido');
 $('#v-admin').innerHTML=`<div class="ph"><div><h2>Asignación de tareas</h2><p>Define responsable, plazo y criticidad de cada punto 5S</p></div></div>
 <div class="card flush"><div class="tw"><table><thead><tr><th>Módulo</th><th>Punto</th><th>Levantado</th><th></th></tr></thead><tbody>${sin.length?sin.map((p,i)=>`<tr class="row" style="animation-delay:${i*40}ms"><td><b>${esc(p.modulo)}</b></td><td>${esc(p.descripcion)}</td><td class="mono mu">${esc(p.fechaLevantamiento)}</td><td class="ra"><button class="btn b-pri" onclick="ptAsignar('${p.id}')">Asignar</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Todo está asignado</td></tr>'}</tbody></table></div></div>`;
}
function ptMut(id,fn){const a=DB.get('puntos',[]),p=a.find(x=>x.id===id);if(p)fn(p);DB.set('puntos',a);renderAll()}
function ptCerrar(id){
 if(!puedeGestionar())return toast('Solo admin y usuarios comunes pueden cerrar','err');
 openModal({title:'Cerrar punto',icon:'check-circle-2',cls:'b-ok',ok:'Cerrar como solucionado',body:fld('¿Alguien apoyó en el cierre?',`<input id="f_a" placeholder="Nombres (opcional)">`),
 onOk(){const ap=$('#f_a').value.trim();ptMut(id,p=>{p.estado='atendido';p.fechaCumplido=hoy();p.usuarioCierra=S.user;p.personalApoyo=ap||null;notifyRoles(['admin'],`Punto solucionado por ${nom(S.user)}: "${p.descripcion.slice(0,40)}…"`)});toast('Punto cerrado','ok')}});
}
function ptAsignar(id){
 openModal({title:'Asignar tarea',icon:'user-plus',ok:'Cargar tarea',
 body:fld('Trabajador',`<select id="f_u">${opts(usersRol(['admin','comun']))}</select>`)+fld('Fecha límite',`<input type="date" id="f_f">`)+fld('Criticidad (1 baja – 5 crítica)',`<select id="f_c">${opts([[1,'1 · Baja'],[2,'2 · Media baja'],[3,'3 · Media'],[4,'4 · Alta'],[5,'5 · Crítica']],3)}</select>`),
 onOk(){const f=$('#f_f').value;if(!f){toast('Selecciona fecha límite','err');return false}
  const u=$('#f_u').value,c=+$('#f_c').value;ptMut(id,p=>{p.usuarioAsignado=u;p.fechaLimite=f;p.criticidad=c;p.estado='en_proceso';notify(u,`Nueva tarea (nivel ${c}): "${p.descripcion.slice(0,40)}…"`)});beep();toast('Tarea asignada','ok')}});
}
function modNuevo(){
 if(!esAdmin())return toast('Solo el administrador crea módulos','err');
 openModal({title:'Nuevo módulo L10',icon:'layers',ok:'Crear módulo',body:fld('Nombre',`<input id="f_m" placeholder="Ej. Módulo 8">`),
 onOk(){const n=$('#f_m').value.trim();if(!n)return false;const a=DB.get('modulos',[]);if(!a.includes(n)){a.push(n);DB.set('modulos',a)}renderAll()}});
}

/* Editar / eliminar: solo admin y usuario común, y solo puntos propios no cerrados */
const ptMio=p=>puedeGestionar()&&p.usuarioLevanta===S.user&&p.estado!=='atendido';
function ptEditar(id){
 const p=DB.get('puntos',[]).find(x=>x.id===id);if(!p)return;
 openModal({title:'Editar punto 5S',icon:'pencil',ok:'Guardar cambios',body:fld('Módulo',`<select id="f_mod">${opts(DB.get('modulos',[]).map(m=>[m,m]),p.modulo)}</select>`)+fld('Descripción',`<textarea id="f_d" rows="3">${esc(p.descripcion)}</textarea>`),
 onOk(){const d=$('#f_d').value.trim();if(!d){toast('Escribe la descripción','err');return false}ptMut(id,k=>{k.modulo=$('#f_mod').value;k.descripcion=d});toast('Punto actualizado','ok')}});
}
function ptEliminar(id){
 openModal({title:'Eliminar punto',icon:'trash-2',cls:'b-no',ok:'Eliminar',body:'<p>El punto se eliminará de forma permanente.</p>',onOk(){DB.set('puntos',DB.get('puntos',[]).filter(x=>x.id!==id));toast('Punto eliminado');renderAll()}});
}
</script>
<script>
/* ===== Gestión de usuarios (solo administrador) ===== */
function renderUsuarios(){
 if(!esAdmin()){$('#v-usuarios').innerHTML=`<div class="lock"><i data-lucide="shield-alert"></i>Acceso restringido al administrador.</div>`;return}
 $('#v-usuarios').innerHTML=`<div class="ph"><div><h2>Usuarios</h2><p>Crea cuentas y define el tipo de acceso de cada persona</p></div><button class="btn b-pri" onclick="usuarioNuevo()"><i data-lucide="user-plus"></i>Nuevo usuario</button></div>
 <div class="card flush"><div class="tw"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Tipo</th><th></th></tr></thead><tbody>${Object.values(USERS).map(u=>`<tr class="row"><td><b>${esc(u.n)}</b></td><td class="mu">${esc(u.email)}</td>
 <td><select style="width:auto" onchange="FB.setRol('${u.uid}',this.value);toast('Tipo actualizado','ok')" ${u.email===S.user?'disabled':''}>${opts(Object.entries(RL),u.r)}</select></td>
 <td class="ra">${u.email===S.user?'<span class="mu sm">Tú</span>':`<button class="ib no" title="Quitar acceso" onclick="usuarioQuitar('${u.uid}')"><i data-lucide="user-x"></i></button>`}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function usuarioNuevo(){
 openModal({title:'Nuevo usuario',icon:'user-plus',ok:'Crear usuario',
 body:fld('Nombre',`<input id="f_n">`)+fld('Correo',`<input id="f_e" type="email">`)+fld('Contraseña (mínimo 6 caracteres)',`<input id="f_p" type="text">`)+fld('Tipo de usuario',`<select id="f_r">${opts(Object.entries(RL),'comun')}</select>`),
 onOk(){const n=$('#f_n').value.trim(),e=$('#f_e').value.trim(),p=$('#f_p').value,r=$('#f_r').value;
  if(!n||!e||p.length<6){toast('Completa nombre, correo y contraseña de 6+ caracteres','err');return false}

<script>

let chatA='general';

function renderChat(){
 const old=$('#chatIn'),val=old?old.value:'',foc=old&&document.activeElement===old;
 const todos=DB.get('chat',[]),msgs=chatA==='general'?todos.filter(c=>c.receptor==='general'):todos.filter(c=>(c.emisor===S.user&&c.receptor===chatA)||(c.emisor===chatA&&c.receptor===S.user));

 <div class="chat"><div class="card cl">${tab('general','users','Chat general L10')}${Object.keys(USERS).filter(e=>e!==S.user).map(e=>tab(e,'user',nom(e))).join('')}</div>
 <div class="card cb"><div class="cm" id="cm">${msgs.length?msgs.map(m=>`<div class="msg ${m.emisor===S.user?'me':''}"><small>${esc(nom(m.emisor))} · ${esc(m.fecha)}</small><div>${esc(m.texto)}</div></div>`).join(''):'<p class="empty">Aún no hay mensajes</p>'}</div>

<script>
/* ===== Portal del Reportero: interfaz propia, solo tickets (crear, seguimiento, historial propio y tablero del equipo) ===== */
let repTab='nuevo',repShown='',repMiF='todos',repEqF='todos',repQ='';
const REPTABS={nuevo:['plus-circle','Nuevo ticket'],mios:['clipboard-list','Mis tickets'],equipo:['users','Tablero del equipo']};

/* Fase vista por quien reporta. "Recién asignado" = ya lo aceptó alguien pero aún no empieza; "En proceso" = quien lo atiende ya lo marcó en proceso */
const FASE={nuevo:['Sin aceptar','#f59e0b','inbox'],asignado:['Recién asignado','#3b82f6','user-check'],proceso:['En proceso','#8b5cf6','loader'],
 resuelto:['Resuelto','#10b981','check-circle-2'],rechazado:['Rechazado','#ef4444','ban'],revocado:['Revocado','#64748b','undo-2']};
const tkFase=t=>t.estado==='abierto'?'nuevo':t.estado==='asignado'?(t.avance==='en_proceso'?'proceso':'asignado'):t.estado;
const faseB=f=>`<span class="badge" style="--c:${FASE[f][1]}"><i data-lucide="${FASE[f][2]}"></i>${FASE[f][0]}</span>`;

const REPF_M={todos:['Todos',()=>true],nuevo:['Sin aceptar',f=>f==='nuevo'],asignado:['Recién asignados',f=>f==='asignado'],proceso:['En proceso',f=>f==='proceso'],
 resuelto:['Resueltos',f=>f==='resuelto'],fin:['Rechazados / revocados',f=>f==='rechazado'||f==='revocado']};
const REPF_E={todos:['Todos',()=>true],nuevo:['Abiertos · sin aceptar',f=>f==='nuevo'],asignado:['Recién asignados',f=>f==='asignado'],proceso:['En proceso',f=>f==='proceso'],
 resuelto:['Cerrados · cumplidos',f=>f==='resuelto'],rechazado:['Rechazados',f=>f==='rechazado']};

function repGo(t){repTab=t;renderRep();scrollTo({top:0,behavior:'smooth'})}
function repSetF(k){if(repTab==='mios')repMiF=k;else repEqF=k;repRefresh();icons()}

function repShellHtml(){

 return `<header class="rp-top">
  <div class="rp-brand"><i data-lucide="ticket"></i><div><b>Mesa de tickets</b><small>Portal de reportes · L10</small></div></div>
  <nav class="rp-tabs">${Object.entries(REPTABS).map(([k,[ic,l]])=>`<button data-t="${k}" onclick="repGo('${k}')"><i data-lucide="${ic}"></i>${l}${k==='mios'?'<em id="rpBMios">0</em>':''}</button>`).join('')}</nav>

    <div id="repND" class="drop"><div class="dh2"><b>Notificaciones</b><button onclick="limpiarNotifs();repNotifs()">Limpiar</button></div><div id="repNL"></div></div></div>

function repSkeleton(){
 if(repTab==='nuevo')return `<section class="rp-new">

   <div class="card"><h4><i data-lucide="history"></i>Tus últimos tickets</h4><div id="rpRecent"></div></div>
  </aside></section>`;

 if(!$('#rpMain')){$('#rep').innerHTML=repShellHtml();repShown=''}

function repCard(t,mine){
 const f=tkFase(t),i={nuevo:0,asignado:1,proceso:2,resuelto:4}[f],L=['Enviado','Aceptado','En proceso','Resuelto'];
 const track=i===undefined?`<div class="rp-end" style="--c:${FASE[f][1]}">${f==='rechazado'?'Rechazado por '+esc(nom(t.rechazadoPor))+': '+esc(t.motivoRechazo||''):'Revocado por ti antes de ser aceptado'+(t.motivoRevoca?': '+esc(t.motivoRevoca):'')}</div>`
  :`<div class="rp-st">${L.map((l,k)=>`<div class="${k<i?'dn':k===i?'now':''}"><i>${k<i?'✓':k+1}</i><span>${l}</span></div>`).join('')}</div>`;
 return `<article class="rp-tk" style="--c:${FASE[f][1]}">
  <div class="rp-th"><span class="mono acc">${esc(t.id)}</span>${faseB(f)}${urgB(t.urgencia)}<span class="mu sm">${esc(t.modulo)}</span></div>
  <h3>${esc(t.resumen)}</h3><p class="mu">${esc(t.comentario)}</p>
  <div class="rp-meta">${mine?'':`<span>Reportó: <b>${esc(nom(t.usuarioReporta))}</b></span>`}<span>Creado: ${fmtD(t.creado)}</span><span>Responsable: ${t.usuarioAsignado?`<b>${esc(nom(t.usuarioAsignado))}</b>`:'<em>aún sin asignar</em>'}</span>${slaHtml(t)}</div>
  ${track}
  <div class="rp-act"><button class="btn" onclick="tkDetalle('${t.id}')"><i data-lucide="history"></i>Historial</button>${mine&&t.estado==='abierto'?`<button class="btn b-no" onclick="tkRevocar('${t.id}')"><i data-lucide="undo-2"></i>Revocar</button>`:''}</div></article>`;
}

function repRefresh(){
 const tk=DB.get('tickets',[]);
 if(repTab==='nuevo'){
  const sel=$('#f_mod'),m=DB.get('modulos',[]);
  if(sel&&sel.options.length!==m.length){const v=sel.value;sel.innerHTML=opts(m.map(x=>[x,x]),v)}
  const rec=tk.filter(t=>t.usuarioReporta===S.user).slice(0,4);
  $('#rpRecent').innerHTML=rec.length?rec.map(t=>`<div class="rp-mini" onclick="repGo('mios')"><div><b>${esc(t.id)}</b><span class="mu sm"> · ${esc(t.resumen)}</span></div>${faseB(tkFase(t))}</div>`).join(''):'<p class="mu sm">Aún no has reportado nada.</p>';
  return;
 }
 const mine=repTab==='mios',F=mine?REPF_M:REPF_E,sel=mine?repMiF:repEqF,q=repQ.toLowerCase();
 const base=mine?tk.filter(t=>t.usuarioReporta===S.user):tk.filter(t=>t.usuarioReporta!==S.user&&t.estado!=='revocado');
 $('#rpStats').innerHTML=['nuevo','asignado','proceso','resuelto'].map(k=>`<button class="rp-stat ${sel===k?'on':''}" style="--c:${FASE[k][1]}" onclick="repSetF('${k}')"><i data-lucide="${FASE[k][2]}"></i><div><small>${F[k][0]}</small><b>${base.filter(t=>tkFase(t)===k).length}</b></div></button>`).join('');
 $('#rpChips').innerHTML=Object.entries(F).map(([k,[l,fn]])=>`<button class="${k===sel?'on':''}" onclick="repSetF('${k}')">${l}<em>${base.filter(t=>fn(tkFase(t))).length}</em></button>`).join('');
 const rows=base.filter(t=>F[sel][1](tkFase(t))).filter(t=>!q||[t.id,t.resumen,t.modulo,t.comentario,nom(t.usuarioReporta),nom(t.usuarioAsignado)].join(' ').toLowerCase().includes(q))
  .sort((a,b)=>(activo(b)-activo(a))||b.creado-a.creado);
 $('#rpList').innerHTML=rows.length?rows.map(t=>repCard(t,mine)).join(''):`<div class="card empty">${mine?'Aún no hay tickets en esta vista':'No hay tickets de otras personas en esta vista'}</div>`;
}

function repEnviar(){

/* Notificaciones del portal (mismos datos que el resto del sistema) */

function repToggleNotifs(){

document.addEventListener('click',e=>{const d=$('#repND');if(d&&!e.target.closest('.rel'))d.classList.remove('on')});
