<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Operational Hub · L10</title>
<style>
:root{--bg:#070b14;--p:#0e1525;--p2:#131c30;--l:#1d2842;--tx:#e6ebf5;--mu:#8393b2;--pri:#4f8cff;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1100px 500px at 85% -10%,#1a2c6055,transparent),var(--bg);color:var(--tx);display:grid;grid-template-columns:250px 1fr;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
#side{background:var(--p);border-right:1px solid var(--l);padding:18px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center}
.lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4f8cff,#7c5cff);display:grid;place-items:center;box-shadow:0 8px 24px #4f8cff45}
.brand b{display:block;font-size:13px;letter-spacing:.08em}.brand small{color:var(--mu);font-size:11px}
.nav{display:grid;gap:4px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:12px;color:var(--mu);cursor:pointer;font-weight:600;font-size:13px;transition:.25s var(--ease)}
.nav button:hover{background:#ffffff09;color:var(--tx);transform:translateX(3px)}
.nav button.on{background:linear-gradient(90deg,#4f8cff30,#4f8cff08);color:#fff}
.nav button.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--pri);animation:grow .3s var(--ease)}
.nav svg{width:17px;height:17px}
.nav em{margin-left:auto;font-style:normal;font-size:11px;background:#f59e0b25;color:#fbbf24;padding:1px 8px;border-radius:99px}
.mods{border-top:1px solid var(--l);padding-top:14px}.mh{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:8px}
.mh button{background:none;border:0;color:var(--pri);cursor:pointer;display:grid}.mh svg{width:15px;height:15px}
.sm1{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#ffffff06;margin-bottom:6px;font-size:12px;color:#c6d0e6}
.sm1 svg{width:14px;height:14px;color:var(--pri)}
#shell{min-width:0}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 28px;background:#070b14d9;backdrop-filter:blur(14px);border-bottom:1px solid var(--l)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px}.crumb svg{width:14px;height:14px}.crumb b{color:var(--tx)}
.hr{display:flex;align-items:center;gap:10px}
select,input:not([type=radio]),textarea{background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:9px 12px;width:100%;transition:.2s}
#rol{width:auto;font-size:12px;font-weight:600}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px #4f8cff25}
.ib{position:relative;width:36px;height:36px;display:inline-grid;place-items:center;border-radius:11px;border:1px solid var(--l);background:var(--p2);cursor:pointer;transition:.2s}
.ib:hover{background:#1c2845;transform:translateY(-1px)}.ib svg{width:16px;height:16px}
.ib.ok:hover{background:#10b98133;color:#34d399}.ib.no:hover{background:#ef444433;color:#f87171}
.nb{position:absolute;top:-5px;right:-5px;background:#ef4444;font-size:10px;font-weight:800;padding:0 5px;border-radius:99px;display:none;animation:pop .4s var(--ease)}
.pill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;background:#4f8cff18;border:1px solid #4f8cff40;font-size:12px}.pill svg{width:15px;height:15px;color:var(--pri)}.pill b{color:var(--pri)}
.rel{position:relative}.drop{position:absolute;right:0;top:46px;width:320px;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:12px;box-shadow:0 20px 50px #000a;opacity:0;pointer-events:none;transform:translateY(-8px) scale(.98);transition:.2s var(--ease)}
.drop.on{opacity:1;pointer-events:auto;transform:none}
.dh2{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px}.dh2 button{background:none;border:0;color:var(--pri);cursor:pointer}
#nList{max-height:300px;overflow:auto;display:grid;gap:6px}
.nt{padding:9px 11px;border-radius:11px;background:var(--bg);border:1px solid var(--l);font-size:12px}.nt.un{border-left:3px solid var(--pri)}.nt small{display:block;color:var(--mu);font-size:10px}
main{padding:26px 28px 50px}
.view{display:none}
.view.on{display:block;animation:in .4s var(--ease)}
.view.out{display:block;opacity:0;transform:translateX(-14px);transition:.18s ease-in}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h2{font-size:24px;letter-spacing:-.02em}.ph p{color:var(--mu);font-size:13px}.acts{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;border:1px solid var(--l);background:var(--p2);cursor:pointer;font-weight:700;font-size:12px;transition:.2s var(--ease)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.15)}.btn svg{width:15px;height:15px}
.b-pri{background:linear-gradient(135deg,#4f8cff,#6a5cff);border:0;box-shadow:0 8px 22px #4f8cff40}
.b-amb{background:linear-gradient(135deg,#f59e0b,#ea580c);border:0;box-shadow:0 8px 22px #f59e0b35}
.b-ok{background:linear-gradient(135deg,#10b981,#059669);border:0}.b-no{background:linear-gradient(135deg,#ef4444,#be123c);border:0}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kpi{--c:#4f8cff;display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,var(--p)),var(--p));border:1px solid color-mix(in srgb,var(--c) 28%,var(--l));transition:.25s var(--ease)}
.kpi:hover{transform:translateY(-4px);box-shadow:0 14px 34px color-mix(in srgb,var(--c) 22%,transparent)}
.kpi>svg{width:40px;height:40px;padding:9px;border-radius:12px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.kpi small{color:var(--mu);font-size:12px;display:block}.kpi b{font-size:28px;line-height:1.1;letter-spacing:-.02em}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:18px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#aab6d3;margin-bottom:14px;display:flex;align-items:center;gap:8px}.card h4 svg{width:15px;height:15px;color:var(--pri)}
.ch{height:230px;position:relative}
.view.on .kpi,.view.on .card,.view.on .scale{animation:up .5s var(--ease) both}
.kpis>:nth-child(2),.g2>:nth-child(2){animation-delay:.07s!important}.kpis>:nth-child(3),.g2>:nth-child(3){animation-delay:.14s!important}.kpis>:nth-child(4),.g2>:nth-child(4){animation-delay:.21s!important}.kpis>:nth-child(5){animation-delay:.28s!important}
.urow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--p2);margin-bottom:8px;cursor:pointer;border-left:4px solid var(--c);transition:.2s var(--ease)}
.urow:hover{transform:translateX(4px);background:#1a2540}.urow div{flex:1;min-width:0}.urow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:12px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);background:#0a1120;border-bottom:1px solid var(--l)}
td{padding:12px 14px;border-bottom:1px solid #162038;vertical-align:top}tr.row{animation:up .4s var(--ease) both}tr.row:hover td{background:#ffffff05}
.ra{text-align:right;white-space:nowrap}.ra .ib{margin-left:4px}
.mono{font-family:ui-monospace,monospace}.acc{color:#fbbf24;font-weight:700}.mu{color:var(--mu)}.sm{font-size:11px}.warn-t{color:#fbbf24}.empty{text-align:center;color:var(--mu);padding:30px}
.badge{--c:#8393b2;display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block}
.sla{display:inline-block;margin-top:3px;font:700 13px ui-monospace,monospace;letter-spacing:.02em}.sla.ok{color:#34d399}.sla.warn{color:#fbbf24}.sla.over{color:#f87171;animation:blink 1.2s infinite}
.scale{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.scale span{--c:#888;display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:600;background:var(--p);border:1px solid color-mix(in srgb,var(--c) 40%,var(--l))}
.tb{display:flex;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid var(--l);flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--l);background:none;color:var(--mu);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}.chips em{font-style:normal;margin-left:6px;opacity:.7}
.search{max-width:280px}
.stack{display:grid;gap:16px}.ch2{display:flex;justify-content:space-between;align-items:center}.ch2 h4{margin:0}
.bar{height:6px;background:var(--p2);border-radius:9px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#34d399);border-radius:9px;transition:width .8s var(--ease)}
.crit{padding:2px 9px;border-radius:7px;font-weight:800;font-size:11px;color:#fff}
.lock{display:flex;gap:12px;align-items:center;padding:16px;border-radius:16px;background:#ef444414;border:1px solid #ef444440;color:#fca5a5}
#modal{position:fixed;inset:0;background:#02050cb8;backdrop-filter:blur(8px);z-index:50;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:.2s}
#modal.on{opacity:1;pointer-events:auto}
.dlg{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--p);border:1px solid var(--l);border-radius:20px;box-shadow:0 30px 80px #000c;transform:translateY(16px) scale(.96);transition:.3s var(--ease)}
#modal.on .dlg{transform:none}
.dh,.df{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}.dh{border-bottom:1px solid var(--l)}.df{border-top:1px solid var(--l);justify-content:flex-end;gap:8px}
.dh h3{font-size:15px;display:flex;gap:10px;align-items:center}.dh h3 svg{width:18px;height:18px;color:var(--pri)}
.x{background:none;border:0;font-size:24px;color:var(--mu);cursor:pointer}.db{padding:20px;display:grid;gap:14px}
.fl{display:grid;gap:6px;font-size:12px}.fl>span{color:var(--mu);font-weight:600}
.urg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.urg label{cursor:pointer}.urg input{display:none}
.urg span{display:grid;text-align:center;padding:9px 2px;border:1px solid var(--l);border-top:3px solid var(--c);border-radius:12px;background:var(--p2);transition:.2s var(--ease)}
.urg b{font-size:11px}.urg small{font-size:10px;color:var(--mu)}
.urg input:checked+span{background:color-mix(in srgb,var(--c) 22%,var(--p2));border-color:var(--c);transform:translateY(-3px);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 30%,transparent)}
.tl{display:grid;gap:10px;border-left:2px solid var(--l);padding-left:14px;font-size:12px}.tl small{color:var(--mu);display:block}
.rej{padding:10px 12px;border-radius:12px;background:#ef444414;border:1px solid #ef444440;font-size:12px}
.chat{display:grid;grid-template-columns:260px 1fr;gap:16px;height:540px}
.cl{display:grid;gap:6px;align-content:start}.cl button{display:flex;align-items:center;gap:8px;text-align:left;padding:11px;border-radius:12px;border:0;background:none;color:var(--mu);cursor:pointer;font-weight:600;transition:.2s}
.cl button.on{background:var(--pri);color:#fff}.cl button:not(.on):hover{background:#ffffff0a}.cl svg{width:15px;height:15px}
.cb{display:flex;flex-direction:column;padding:0;overflow:hidden}.cm{flex:1;overflow:auto;padding:16px;display:grid;gap:10px;align-content:start}
.msg{display:flex;flex-direction:column;animation:up .3s var(--ease)}.msg.me{align-items:flex-end}.msg small{font-size:10px;color:var(--mu);margin-bottom:3px}
.msg div{padding:10px 14px;border-radius:16px;max-width:75%;background:var(--p2);border:1px solid var(--l)}.msg.me div{background:var(--pri);border:0;border-bottom-right-radius:4px}
.ci{display:flex;gap:8px;padding:12px;border-top:1px solid var(--l)}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:60}
.toast{padding:12px 16px;border-radius:14px;background:var(--p2);border:1px solid var(--l);border-left:4px solid var(--pri);box-shadow:0 12px 30px #000a;font-size:13px;animation:slide .35s var(--ease)}
.toast.ok{border-left-color:#10b981}.toast.err{border-left-color:#ef4444}.toast.bye{opacity:0;transform:translateX(30px);transition:.3s}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes blink{50%{opacity:.45}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:820px){body{grid-template-columns:64px 1fr}.brand div:last-child,.nav button span,.mods,.nav em{display:none}.chat{grid-template-columns:1fr}.pill{display:none}main{padding:18px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% 0%,#1a2c60aa,var(--bg));z-index:80}
body.in #login{display:none}body:not(.in) #side,body:not(.in) #shell{display:none}
.lcard{width:340px;display:grid;gap:12px;padding:30px;background:var(--p);border:1px solid var(--l);border-radius:22px;box-shadow:0 30px 80px #000c;animation:up .5s var(--ease)}
.lcard .lg{margin:0 auto 4px}.lcard h2{text-align:center}.lcard p{text-align:center;color:var(--mu);font-size:13px}#lErr{color:#f87171;font-size:12px;min-height:16px;text-align:center}
.me{display:flex;align-items:center;gap:10px}.me .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4f8cff,#7c5cff);display:grid;place-items:center;font-weight:800}
.me b{display:block;font-size:12px;line-height:1.2}.me small{display:block;color:var(--mu);font-size:10px;line-height:1.1}

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>

<body>
<aside id="side">
  <div class="brand"><div class="lg"><i data-lucide="shield-check"></i></div><div><b>OPERATIONAL HUB</b><small>L10 · 5S & Hallazgos</small></div></div>
  <nav class="nav">
    <button data-v="dashboard" onclick="go('dashboard')"><i data-lucide="layout-dashboard"></i>Dashboard</button>
    <button data-v="tickets" onclick="go('tickets')"><i data-lucide="ticket"></i>Tickets<em id="bTk">0</em></button>

  <div class="mods"><div class="mh"><span>Módulos L10</span><button onclick="modNuevo()" title="Nuevo módulo"><i data-lucide="plus"></i></button></div><div id="sideMods"></div></div>
</aside>

        <button class="ib" onclick="toggleNotifs()"><i data-lucide="bell"></i><span id="nBadge" class="nb"></span></button>
        <div id="nDrop" class="drop"><div class="dh2"><b>Notificaciones</b><button onclick="limpiarNotifs()">Limpiar</button></div><div id="nList"></div></div>

<script>
/* ===== Roles, escala de urgencia (SLA) y capa de datos (caché sincronizada con Firestore) ===== */
const USERS={},S={user:null};               /* USERS se llena desde Firestore (colección usuarios) */
const RL={admin:'Administrador',comun:'Usuario común',reportero:'Reportero'};
const rolDe=e=>USERS[e]?USERS[e].r:null,esAdmin=()=>rolDe(S.user)==='admin',puedeGestionar=()=>['admin','comun'].includes(rolDe(S.user));
const usersRol=rs=>Object.values(USERS).filter(u=>rs.includes(u.r)).map(u=>[u.email,u.n]);
const notifyRoles=(rs,m)=>usersRol(rs).filter(([e])=>e!==S.user).forEach(([e])=>notify(e,m));
const nom=e=>USERS[e]?USERS[e].n:(e||'—');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
/* min = minutos máximos de atención; 0 = durante esta semana (hasta el domingo 23:59) */
const URG={
 1:{n:'Crítica',min:30,c:'#ef4444',t:'30 min'},
 2:{n:'Alta',min:60,c:'#f97316',t:'1 hora'},
 3:{n:'Media',min:240,c:'#eab308',t:'4 horas'},
 4:{n:'Baja',min:1440,c:'#84cc16',t:'24 horas'},
 5:{n:'Programada',min:0,c:'#10b981',t:'Esta semana'}};
const PCRIT={1:'#10b981',2:'#84cc16',3:'#eab308',4:'#f97316',5:'#ef4444'};
const MOTIVOS=['Duplicado','Información insuficiente','No es competencia de este equipo','Sin evidencia / no reproducible','Ya estaba resuelto','No procede','Otro'];

/* Caché en memoria: firebase.js la actualiza con onSnapshot; DB.set escribe solo los documentos que cambiaron */
const C={puntos:[],tickets:[],modulos:[],notificaciones:[],chat:[]};
const COL={puntos:{id:x=>x.id},tickets:{id:x=>x.id},notificaciones:{id:x=>String(x.id)},chat:{id:x=>String(x.id)},
 modulos:{id:x=>x.replace(/\W/g,'_')+x.length,doc:x=>({nombre:x,orden:Date.now()})}};
const DB={get:(k,d)=>C[k]??d,
 set(k,v){const cfg=COL[k],old=new Map((C[k]||[]).map(x=>[cfg.id(x),JSON.stringify(x)])),seen=new Set();C[k]=v;
  v.forEach(x=>{const id=cfg.id(x);seen.add(id);if(old.get(id)!==JSON.stringify(x))FB.put(k,id,cfg.doc?cfg.doc(x):x)});
  old.forEach((_,id)=>{if(!seen.has(id))FB.del(k,id)})}};
function resetCache(){for(const k in C)C[k]=[];Object.keys(USERS).forEach(k=>delete USERS[k])}

function calcSla(base,u){
 const m=URG[u].min;if(m)return base+m*60000;
 const d=new Date(base);d.setDate(d.getDate()+(7-d.getDay())%7);d.setHours(23,59,59,0);return d.getTime();
}
function addHist(t,txt){t.hist=t.hist||[];t.hist.push({t:Date.now(),u:S.user,txt})}
function notify(to,msg){
 const n=DB.get('notificaciones',[]);
 n.unshift({id:Date.now()+String(Math.floor(Math.random()*1e4)).padStart(4,'0'),destinatario:to,mensaje:msg,leido:false,fecha:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})});
 DB.set('notificaciones',n.slice(0,300));
}

<script>
/* ===== Utilidades de interfaz: modales, toasts, sonido, navegación, helpers compartidos ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const icons=()=>{if(window.lucide)lucide.createIcons()};
function toast(m,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>{e.classList.add('bye');setTimeout(()=>e.remove(),300)},3400)}
let _ac;
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;_ac=_ac||new A();const c=_ac;if(c.state==='suspended')c.resume();
 const m=c.createGain(),k=c.createDynamicsCompressor();m.gain.value=1;m.connect(k);k.connect(c.destination);
 for(let i=0;i<4;i++){const t=c.currentTime+i*.5,o=c.createOscillator(),g=c.createGain(),up=i%2;o.type='square';o.frequency.setValueAtTime(up?988:740,t);o.frequency.exponentialRampToValueAtTime(up?1480:1175,t+.4);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1,t+.03);g.gain.exponentialRampToValueAtTime(.01,t+.45);o.connect(g);g.connect(m);o.start(t);o.stop(t+.5)}}catch(e){}}
function hablar(txt){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt),v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('es'));u.lang='es-MX';u.volume=1;u.rate=.95;if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function alertaTicket(t){beep();toast(`🚨 Nuevo ticket de ${nom(t.usuarioReporta)} · ${t.modulo}`,'err');setTimeout(()=>hablar(`Nuevo ticket. Levantado por ${nom(t.usuarioReporta)}. Módulo: ${t.modulo}.`),2100)}
/* Los navegadores bloquean audio y voz hasta el primer clic de la persona */
document.addEventListener('click',()=>{try{const A=window.AudioContext||window.webkitAudioContext;_ac=_ac||new A();_ac.resume();speechSynthesis.getVoices()}catch(e){}},{once:true});
function countTo(el,n){const s=+el.dataset.v||0,t0=performance.now();el.dataset.v=n;(function f(t){const p=Math.min(1,(t-t0)/650);el.textContent=Math.round(s+(n-s)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}

/* Modal genérico */
function openModal({title,icon='circle',body,ok='Guardar',cls='b-pri',onOk}){
 $('#dlg').innerHTML=`<div class="dh"><h3><i data-lucide="${icon}"></i>${title}</h3><button class="x" onclick="closeModal()">×</button></div><div class="db">${body}</div><div class="df"><button class="btn" onclick="closeModal()">${onOk?'Cancelar':'Cerrar'}</button>${onOk?`<button class="btn ${cls}" id="mok">${ok}</button>`:''}</div>`;
 if(onOk)$('#mok').onclick=()=>{if(onOk()!==false)closeModal()};
 $('#modal').classList.add('on');icons();
 const f=$('#dlg input:not([type=radio]),#dlg textarea,#dlg select');if(f)setTimeout(()=>f.focus(),80);
}
const closeModal=()=>$('#modal').classList.remove('on');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const fld=(l,h)=>`<label class="fl"><span>${l}</span>${h}</label>`;
const opts=(a,sel)=>a.map(([v,t])=>`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(t)}</option>`).join('');
const urgPick=sel=>`<div class="fl"><span>¿Qué tan crítica es la atención?</span><div class="urg">${Object.entries(URG).map(([k,u])=>`<label style="--c:${u.c}"><input type="radio" name="urg" value="${k}" ${k==sel?'checked':''}><span><b>${u.n}</b><small>${u.t}</small></span></label>`).join('')}</div><small class="mu">Tiempo máximo de atención: desde los próximos 30 minutos hasta esta semana.</small></div>`;
const urgVal=()=>+$('input[name=urg]:checked').value;

/* Helpers compartidos */
const ST={abierto:['Abierto','#ef4444'],asignado:['Asignado','#f59e0b'],resuelto:['Resuelto','#10b981'],rechazado:['Rechazado','#8393b2'],pendiente:['Pendiente','#ef4444'],en_proceso:['En proceso','#f59e0b'],atendido:['Atendido','#10b981']};
const badge=s=>`<span class="badge" style="--c:${ST[s][1]}">${ST[s][0]}</span>`;
const urgB=u=>`<span class="badge" style="--c:${URG[u].c}"><i class="dot"></i>${URG[u].n}</span>`;
const activo=t=>t.estado==='abierto'||t.estado==='asignado';
const fmtD=d=>new Date(d).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function fmtCount(ms){const a=Math.abs(ms),s=Math.floor(a/1000),d=Math.floor(s/86400),p=n=>String(n).padStart(2,'0');return(ms<0?'Vencido +':'')+(d?d+'d ':'')+p(Math.floor(s%86400/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)}
function fmtLeft(ms){const m=Math.floor(Math.abs(ms)/60000),h=Math.floor(m/60),d=Math.floor(h/24),s=d?`${d}d ${h%24}h`:h?`${h}h ${m%60}m`:`${m}m`;return ms<0?'Vencido hace '+s:'Quedan '+s}
const slaCls=(t,l)=>l<0?'over':l<(t.sla-(t.slaIni||t.creado))*.25?'warn':'ok';
const slaHtml=t=>{if(!activo(t))return'';const l=t.sla-Date.now();return`<span class="sla ${slaCls(t,l)}" data-sla="${t.id}">⏱ ${fmtCount(l)}</span>`};
function stats(){const p=DB.get('puntos',[]),t=DB.get('tickets',[]),now=Date.now();return{p,t,total:p.length+t.length,
 pend:p.filter(x=>x.estado==='pendiente').length+t.filter(x=>x.estado==='abierto').length,
 proc:p.filter(x=>x.estado==='en_proceso').length+t.filter(x=>x.estado==='asignado').length,
 ok:p.filter(x=>x.estado==='atendido').length+t.filter(x=>x.estado==='resuelto').length,
 rej:t.filter(x=>x.estado==='rechazado').length,over:t.filter(x=>activo(x)&&x.sla<now).length}}

/* Navegación con transición salida/entrada */
const TITLES={dashboard:'Dashboard',tickets:'Tickets y hallazgos',modulos:'Módulos L10',tareas:'Mis tareas',admin:'Asignación',usuarios:'Usuarios',chat:'Chat'};
let cur='dashboard';
function go(v){
 const old=$('.view.on');if(old&&v===cur)return;
 const show=()=>{$$('.view').forEach(x=>x.classList.remove('on','out'));$('#v-'+v).classList.add('on');cur=v;
  $$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#crumb').textContent=TITLES[v];renderAll();scrollTo({top:0,behavior:'smooth'})};
 if(old){old.classList.add('out');setTimeout(show,180)}else show();
}

<script>
/* ===== Dashboard ===== */
let charts=[];
function renderDashboard(){
 const s=stats(),first=USERS[S.user].n.split(' ')[0];
 const top=s.t.filter(activo).sort((a,b)=>a.sla-b.sla).slice(0,5);
 const kp=[['Pendientes',s.pend,'alert-triangle','#ef4444'],['En proceso',s.proc,'clock','#f59e0b'],['Resueltos',s.ok,'check-circle-2','#10b981'],['Rechazados',s.rej,'ban','#8393b2'],['SLA vencidos',s.over,'timer-off','#ef4444']];
 $('#v-dashboard').innerHTML=`
 <div class="ph"><div><h2>Hola, ${esc(first)}</h2><p>${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})} · ${s.total} registros en el sistema</p></div>
  <div class="acts"><button class="btn b-amb" onclick="tkNuevo()"><i data-lucide="alert-circle"></i>Reportar ticket</button><button class="btn b-pri" onclick="ptNuevo()"><i data-lucide="plus-circle"></i>Levantar punto 5S</button></div></div>
 <div class="kpis">${kp.map(([l,v,i,c])=>`<div class="kpi" style="--c:${c}"><i data-lucide="${i}"></i><div><small>${l}</small><b data-n="${v}">0</b></div></div>`).join('')}</div>
 <div class="g2">
  <div class="card"><h4><i data-lucide="siren"></i>Atención inmediata (por tiempo límite)</h4>${top.length?top.map(t=>`<div class="urow" style="--c:${URG[t.urgencia].c}" onclick="tkF='activos';go('tickets')"><div><b>${esc(t.id)} · ${esc(t.resumen)}</b><span class="mu sm">${esc(t.modulo)} · ${URG[t.urgencia].n} (${URG[t.urgencia].t})</span></div>${slaHtml(t)}</div>`).join(''):'<p class="empty">Sin tickets activos 🎉</p>'}</div>
  <div class="card"><h4><i data-lucide="pie-chart"></i>Estado general</h4><div class="ch"><canvas id="c1"></canvas></div></div>
  <div class="card"><h4><i data-lucide="gauge"></i>Tickets activos por urgencia</h4><div class="ch"><canvas id="c2"></canvas></div></div>
  <div class="card"><h4><i data-lucide="bar-chart-3"></i>Activos por módulo</h4><div class="ch"><canvas id="c3"></canvas></div></div>
  <div class="card" style="grid-column:1/-1"><h4><i data-lucide="trophy"></i>Puntos cerrados por persona · hoy, esta semana y este mes</h4><div class="ch"><canvas id="c4"></canvas></div></div>
 </div>`;
 $$('#v-dashboard [data-n]').forEach(e=>countTo(e,+e.dataset.n));
 drawCharts(s);
}
function drawCharts(s){
 if(!window.Chart)return;charts.forEach(c=>c.destroy());
 Chart.defaults.color='#8393b2';Chart.defaults.font.family='Inter,system-ui,sans-serif';
 const base={responsive:true,maintainAspectRatio:false,animation:{duration:900,easing:'easeOutQuart'}},ax={grid:{color:'#1d2842'},ticks:{precision:0}};
 const act=s.t.filter(activo);
 charts=[
  new Chart($('#c1'),{type:'doughnut',data:{labels:['Pendientes','En proceso','Resueltos','Rechazados'],datasets:[{data:[s.pend,s.proc,s.ok,s.rej],backgroundColor:['#ef4444','#f59e0b','#10b981','#64748b'],borderWidth:0,hoverOffset:8}]},options:{...base,cutout:'68%',plugins:{legend:{position:'right',labels:{usePointStyle:true}}}}}),
  new Chart($('#c2'),{type:'bar',data:{labels:Object.values(URG).map(u=>u.n),datasets:[{data:Object.keys(URG).map(k=>act.filter(t=>t.urgencia==k).length),backgroundColor:Object.values(URG).map(u=>u.c),borderRadius:8}]},options:{...base,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:ax}}}),
  new Chart($('#c3'),{type:'bar',data:{labels:DB.get('modulos',[]),datasets:[{data:DB.get('modulos',[]).map(m=>s.p.filter(p=>p.modulo===m&&p.estado!=='atendido').length+act.filter(t=>t.modulo===m).length),backgroundColor:'#4f8cff',borderRadius:8}]},options:{...base,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:ax}}}),cierresChart(s)];
}

/* Cierres por persona: puntos 5S atendidos + tickets resueltos (semana inicia en lunes) */
function cierresChart(s){
 const n=new Date(),hoyS=hoy(),iniS=hoy(new Date(n.getFullYear(),n.getMonth(),n.getDate()-(n.getDay()+6)%7)),mesS=hoyS.slice(0,7),r={};
 usersRol(['admin','comun']).forEach(([e])=>r[e]=[0,0,0]);
 const add=(u,f)=>{if(!u||!f)return;const o=r[u]=r[u]||[0,0,0];if(f===hoyS)o[0]++;if(f>=iniS&&f<=hoyS)o[1]++;if(f.slice(0,7)===mesS)o[2]++};
 s.p.filter(p=>p.estado==='atendido').forEach(p=>add(p.usuarioCierra,p.fechaCumplido));
 s.t.filter(t=>t.estado==='resuelto').forEach(t=>add(t.cierra,t.cerrado&&hoy(new Date(t.cerrado))));
 const k=Object.keys(r),ds=(l,i,c)=>({label:l,data:k.map(e=>r[e][i]),backgroundColor:c,borderRadius:6});
 return new Chart($('#c4'),{type:'bar',data:{labels:k.map(nom),datasets:[ds('Hoy',0,'#4f8cff'),ds('Esta semana',1,'#8b5cf6'),ds('Este mes',2,'#10b981')]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:900},plugins:{legend:{labels:{usePointStyle:true}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#1d2842'},ticks:{precision:0}}}}});
}

<script>

const TKF={activos:activo,abierto:t=>t.estado==='abierto',asignado:t=>t.estado==='asignado',resuelto:t=>t.estado==='resuelto',rechazado:t=>t.estado==='rechazado',todos:()=>true};

function renderTickets(){
 const all=DB.get('tickets',[]);
 $('#v-tickets').innerHTML=`
 <div class="ph"><div><h2>Tickets y hallazgos</h2><p>Atención priorizada por nivel de urgencia y tiempo límite (SLA)</p></div><button class="btn b-amb" onclick="tkNuevo()"><i data-lucide="plus"></i>Nuevo ticket</button></div>
 <div class="scale">${Object.values(URG).map(u=>`<span style="--c:${u.c}"><i class="dot"></i>${u.n} · ${u.t}</span>`).join('')}</div>
 <div class="card flush"><div class="tb"><div class="chips">${Object.keys(TKF).map(k=>`<button class="${k===tkF?'on':''}" onclick="tkF='${k}';renderTickets();icons()">${TKL[k]}<em>${all.filter(TKF[k]).length}</em></button>`).join('')}</div>

function tkMut(id,fn){const a=DB.get('tickets',[]),t=a.find(x=>x.id===id);if(!t)return;fn(t);DB.set('tickets',a);renderAll()}

function tkNuevo(){
 openModal({title:'Reportar ticket / hallazgo',icon:'alert-circle',cls:'b-amb',ok:'Emitir ticket',

function tkDetalle(id){
 const t=DB.get('tickets',[]).find(x=>x.id===id);if(!t)return;

 try{await FB.login($('#lEm').value.trim(),$('#lPw').value)}catch(x){loginErr('Correo o contraseña incorrectos')}}

 S.user=email;const u=USERS[email];showLogin(false);

 cur='';chatA='general';$$('.view').forEach(x=>x.classList.remove('on','out'));go('dashboard');
 if(!_iv){_iv=setInterval(vigilarSla,15000);setInterval(tickSla,1000)}setTimeout(vigilarSla,1500);

function vigilarSla(){
 if(!S.user)return;
 const now=Date.now(),a=DB.get('tickets',[]);let ch=false;
 if(esAdmin())a.forEach(t=>{if(activo(t)&&t.sla<now&&!t.alertado){t.alertado=1;ch=true;
  notify(S.user,`⏰ SLA vencido: ${t.id} · ${t.resumen}`);if(t.usuarioAsignado&&t.usuarioAsignado!==S.user)notify(t.usuarioAsignado,`⏰ SLA vencido: ${t.id}`)}});

  if(!started){ready.add(name);if(ready.size===6){started=true;window.appStart(auth.currentUser.email)}}else window.scheduleRender();
 },fail));
}
onAuthStateChanged(auth,async u=>{
 unsubs.forEach(f=>f());unsubs=[];ready=new Set();started=false;
 if(!u){window.appStop();return}
 try{
  if(!(await getDoc(doc(fs,'usuarios',u.uid))).exists()){
   if((await getDoc(doc(fs,'config','init'))).exists()){await signOut(auth);window.loginErr('Tu usuario no tiene perfil. Pide al administrador que lo cree.');return}
   /* Primer acceso de todo el sistema: ese usuario queda como administrador */
   const b=writeBatch(fs);
   b.set(doc(fs,'usuarios',u.uid),{uid:u.uid,email:u.email,nombre:u.email.split('@')[0],rol:'admin'});
   b.set(doc(fs,'config','init'),{por:u.email,t:Date.now()});await b.commit();
  }
 }catch(e){fail(e);await signOut(auth);return}
 listen('usuarios',a=>{Object.keys(USERS).forEach(k=>delete USERS[k]);a.forEach(x=>USERS[x.email]={n:x.nombre,r:x.rol,uid:x.uid,email:x.email})});
 ['puntos','notificaciones','chat'].forEach(k=>listen(k,a=>{C[k]=a.sort(SORT[k])}));
 /* Ticket nuevo de otra persona: alarma + voz para admin y usuario común */
 listen('tickets',a=>{const prev=new Set(C.tickets.map(t=>t.id));C.tickets=a.sort(SORT.tickets);if(!started)return;const me=auth.currentUser&&auth.currentUser.email;
  if(['admin','comun'].includes(USERS[me]&&USERS[me].r))C.tickets.filter(t=>!prev.has(t.id)&&t.usuarioReporta!==me&&Date.now()-t.creado<120000).forEach(alertaTicket)});
 listen('modulos',a=>{C.modulos=a.sort(SORT.modulos).map(x=>x.nombre)});
});

</script>
